# Dev-/Test-Umgebung Klarwerk. Reproduzierbar, vom Agenten beschreibbar.
# Start: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: klarwerk
      POSTGRES_PASSWORD: klarwerk_dev
      # JOB 2354 (E7): DREI UMGEBUNGEN, DREI NAMEN — `klarwerk_dev`, `klarwerk_prod`,
      # `klarwerk_test`. Bis hierher hiessen Entwicklung und Produktion beide `klarwerk`; wer
      # eine Verbindungszeichenkette in einem Protokoll oder einem Fehlerbericht sah, konnte am
      # Namen nicht erkennen, welche der drei er vor sich hatte. Der Tag, an dem das teuer wird,
      # ist der Tag, an dem jemand einen Befehl auf der falschen ausfuehrt.
      # Gehuetet von tests/app/job2354-drei-datenbanknamen.test.ts.
      POSTGRES_DB: klarwerk_dev
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klarwerk"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:latest
    ports: ["5678:5678"]
    environment:
      N8N_PORT: 5678
      GENERIC_TIMEZONE: Europe/Berlin
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows

  # produkt:20261007:office-artikel-editor (Plan U1): der eingebettete Office-Editor für den TEST.
  # Collabora Online Development Edition (MPL 2.0, nur Entwicklung/Test, nicht für Produktion).
  # Startet NUR mit Profil: `docker compose --profile office up -d office-editor`.
  # Klarwerk braucht dazu KLARWERK_OFFICE_EDITOR_URL=http://localhost:9980, APP_BASE_URL bzw.
  # KLARWERK_WOPI_HOST_URL (wie der Editor Klarwerk erreicht) und KLARWERK_WOPI_SCHLUESSEL
  # (mind. 32 Byte, vom Betreiber erzeugt — nie in diese Datei).
  office-editor:
    image: collabora/code:latest
    profiles: ["office"]
    ports: ["9980:9980"]
    environment:
      # Nur Hosts, die hier stehen, darf der Editor als WOPI-Host ansprechen.
      aliasgroup1: ${KLARWERK_WOPI_HOST_URL:-http://host.docker.internal:3000}
      extra_params: >-
        --o:ssl.enable=false --o:ssl.termination=false
        --o:net.frame_ancestors=${APP_BASE_URL:-http://localhost:5173}

volumes:
  n8n_data:
