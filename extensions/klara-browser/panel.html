<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klara · Browser</title>
    <link rel="stylesheet" href="panel.css" />
    <script src="i18n.js" defer></script>
    <script src="panel.js" defer></script>
  </head>
  <body>
    <main>
      <!-- JOB 3278 · CHR-01: die Kopfzeile wie Klara in Word — links die Wortmarke, rechts die eine
           Bedienung dieser Fläche. Kein Untertitel, kein Satz. -->
      <header>
        <span class="brand">Klara</span>
        <label class="sprache"><span data-i18n="language"></span><select id="language"><option value="de">Deutsch</option><option value="en">English</option></select></label>
      </header>
      <p class="badge" data-i18n="unreviewed"></p>
      <p id="status" role="status" aria-live="polite" tabindex="-1"></p>
      <button type="button" id="refresh" data-i18n="refresh"></button>
      <div class="inhalt">
        <!-- CHR-02, Pflichtlieferung 4: im Ruhezustand steht NUR das Symbol; der eine Satz (≤ 60
             Zeichen) steht oben in #status. Alle erklärenden Absätze hängen an der Vorschau bzw.
             am gespeicherten Entwurf und erscheinen erst dort. -->
        <div id="rest" hidden>
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16"></path><path d="M4 11h16"></path><path d="M4 16h10"></path><path d="M4 21h6"></path></svg>
        </div>
        <p id="pending-capture" class="hint" data-i18n="pendingCapture" hidden></p>
        <section aria-labelledby="account-title">
          <h2 id="account-title" data-i18n="account"></h2>
          <p id="account"></p>
          <p class="hint">https://app.klarwerk.ai</p>
          <form id="login-form">
            <label for="email" data-i18n="email"></label><input id="email" type="email" autocomplete="username" required maxlength="320" />
            <label for="password" data-i18n="password"></label><input id="password" type="password" autocomplete="off" required maxlength="1024" />
            <button type="submit" id="login" data-i18n="login"></button>
          </form>
          <button type="button" id="logout" data-i18n="logout" hidden></button>
        </section>
        <section id="preview" aria-labelledby="preview-title" hidden>
          <h2 id="preview-title" data-i18n="preview"></h2>
          <p id="ai-chat" class="badge" data-i18n="aiChat" hidden></p>
          <p id="source-changed" class="hint" data-i18n="sourceChanged" hidden></p>
          <dl><dt data-i18n="page"></dt><dd id="page"></dd><dt data-i18n="source"></dt><dd id="source"></dd><dt data-i18n="captured"></dt><dd id="captured"></dd><dt data-i18n="scopeLabel"></dt><dd id="scope-value"></dd></dl>
          <p class="hint" data-i18n="sourceHint"></p>
          <p class="hint" data-i18n="originHint"></p>
          <fieldset id="scope-box">
            <legend data-i18n="scope"></legend>
            <label class="choice"><input type="radio" name="mode" id="mode-selection" value="selection" /><span><span data-i18n="modeSelection"></span> <span class="hint" id="info-selection"></span></span></label>
            <label class="choice"><input type="radio" name="mode" id="mode-article" value="article" /><span><span data-i18n="modeArticle"></span> <span class="hint" id="info-article"></span></span></label>
            <label class="choice"><input type="radio" name="mode" id="mode-page" value="page" /><span><span data-i18n="modePage"></span> <span class="hint" id="info-page"></span></span></label>
            <!-- JOB 3280 · CHR-06: der vierte Umfang. Er ist erst wählbar, wenn etwas eingefügt
                 wurde — die Taste darunter ist der einzige Weg, ihn zu füllen. -->
            <label class="choice"><input type="radio" name="mode" id="mode-clipboard" value="clipboard" /><span><span data-i18n="modeClipboard"></span> <span class="hint" id="info-clipboard"></span></span></label>
            <p id="scope-none" class="hint warn" data-i18n="scopeChoose" hidden></p>
            <p class="hint" data-i18n="scopeHint"></p>
          </fieldset>
          <!-- JOB 3280 · CHR-06 / JOB 3412 — DIE ZWISCHENABLAGE WIRD NUR AUF KLICK GELESEN.
               Keine Pflichtberechtigung im Manifest: `clipboardRead` steht dort ausschliesslich
               unter `optional_permissions`. Kein Lesen der Zwischenablage ohne Klick — der Klick
               auf `#paste` fragt das Recht an; ohne Klick wird weder gefragt noch gelesen. Ein
               erteiltes optionales Recht kann bestehen bleiben (Chrome verwaltet es, bis der
               Mensch es entzieht); „kein Dauerrecht" stand hier bis Runde 2 und war falsch.
               Wird es nicht erteilt, nennt `#status` den Griff, der nachweislich trägt — in dieses
               Feld klicken und mit Cmd+V bzw. Strg+V einfügen. Der frühere Satz an dieser Stelle
               („also fragt Chrome beim ersten Mal selbst") war durch die Liveprobe vom 09.09.
               widerlegt und ist deshalb weg. Der eingefügte Text steht danach in einem Feld, das
               Pedi bearbeiten kann — die Vorschau darunter zieht mit. -->
          <fieldset id="clipboard-box">
            <legend data-i18n="clipboardTitle"></legend>
            <p class="hint" data-i18n="clipboardHint"></p>
            <button type="button" id="paste" data-i18n="paste"></button>
            <label for="clipboard" data-i18n="clipboardText"></label><textarea id="clipboard" maxlength="200000" rows="6"></textarea>
            <div id="origin-box" hidden>
              <label for="origin" data-i18n="originLabel"></label>
              <select id="origin"><option value="" data-i18n="originNone"></option><option value="ki_chat" id="origin-ki" data-i18n="originKiChat"></option><option value="web" data-i18n="originWeb"></option><option value="eigen" data-i18n="originEigen"></option></select>
              <p class="hint" data-i18n="originHintClip"></p>
            </div>
          </fieldset>
          <label for="title" data-i18n="title"></label><input id="title" maxlength="90" />
          <label for="context" data-i18n="context"></label><textarea id="context" maxlength="4000" rows="3"></textarea>
          <label for="confidentiality" data-i18n="confidentiality"></label>
          <select id="confidentiality"><option value="" data-i18n="open"></option><option value="intern" data-i18n="internal"></option><option value="vertraulich" data-i18n="confidential"></option><option value="streng_vertraulich" data-i18n="strict"></option></select>
          <p class="hint" data-i18n="classificationHint"></p>
          <div id="gaps-box" hidden><h3 data-i18n="gapsTitle"></h3><ul id="gaps"></ul></div>
          <h3 data-i18n="content"></h3>
          <p class="hint" data-i18n="contentHint"></p>
          <p id="image-note" class="hint" data-i18n="imageNote" hidden></p>
          <div id="content" class="content" tabindex="0"></div>
          <p class="hint" data-i18n="summaryHint"></p>
          <label class="confirm"><input type="checkbox" id="confirm" /><span data-i18n="confirm"></span></label>
          <div class="actions"><button type="button" id="save" class="primary" data-i18n="save" disabled></button><button type="button" id="cancel" data-i18n="cancel"></button></div>
          <p class="hint" data-i18n="instructions"></p>
          <p class="hint" data-i18n="sessionHint"></p>
        </section>
        <section id="done" hidden>
          <p><a id="open" target="_blank" rel="noopener noreferrer" data-i18n="openDraft" hidden></a></p>
          <!-- JOB 3280 · CHR-07: die klare Rückfrage. Es gibt einen Entwurf, aber der Stand in der
               Leiste ist nicht der gespeicherte — der Link erscheint erst wieder, wenn beides
               übereinstimmt. Ein Link auf einen veralteten Stand wäre die stillste Art zu lügen. -->
          <p id="open-stale" class="hint warn" data-i18n="openStale" hidden></p>
          <p class="hint" data-i18n="webSession"></p>
        </section>
      </div>
    </main>
  </body>
</html>
