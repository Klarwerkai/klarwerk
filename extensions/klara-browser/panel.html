<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Klara · Browser</title>
    <link rel="stylesheet" href="panel.css" />
    <script src="i18n.js" defer></script>
    <script src="kontext.js" defer></script>
    <script src="panel.js" defer></script>
  </head>
  <body>
    <main>
      <!-- JOB 3278 · CHR-01: die Kopfzeile wie Klara in Word — links die Wortmarke, rechts die eine
           Bedienung dieser Fläche. Kein Untertitel, kein Satz. -->
      <header>
        <!-- JOB 3512 · KW-MARKE: bei aktiver Firmen-CI tritt das Firmenlogo NEBEN die Wortmarke,
             nicht an ihre Stelle (Pedi: „Produktidentität erkennbar halten"). Die Gruppe hält
             beide zusammen, damit die Kopfzeile ihre Aufteilung links|rechts behält — dieselbe
             Bauform wie `#kw-kopf-links` in Klara/Word. Das Bild startet verborgen und OHNE `src`;
             ein leeres `src` wäre ein Abruf auf die eigene Seite. Beides setzt `panel.js`. -->
        <span class="kopf-links"><span class="brand">Klara</span><img id="marke-logo" alt="" hidden /></span>
        <label class="sprache"><span data-i18n="language"></span><select id="language"><option value="de">Deutsch</option><option value="en">English</option></select></label>
      </header>
      <p class="badge" data-i18n="unreviewed"></p>
      <p id="status" role="status" aria-live="polite" tabindex="-1"></p>
      <button type="button" id="refresh" data-i18n="refresh"></button>
      <div class="inhalt">
        <!-- JOB 3524 · Lieferung 4: DIE ERFOLGSFÜHRUNG STEHT OBEN, AN DER BESTÄTIGUNG.
             Bis hierher stand dieser Abschnitt ganz unten — unter Speichern/Verwerfen und den
             langen Anleitungsabsätzen. Der Link ist derselbe wie zuvor (`#open`, gebaut aus der
             frisch nachgelesenen Entwurfskennung in `panel.js`), er ist nur HOCHGEZOGEN und hat
             mit „Neue Übernahme" die zweite Handlung neben sich. Kein Bibliothekslink: die
             Adresse trägt genau die gespeicherte Kennung. -->
        <section id="done" hidden>
          <p><a id="open" target="_blank" rel="noopener noreferrer" data-i18n="openDraft" hidden></a></p>
          <div class="actions"><button type="button" id="neu" data-i18n="newCapture" hidden></button></div>
          <!-- JOB 3280 · CHR-07: die klare Rückfrage. Es gibt einen Entwurf, aber der Stand in der
               Leiste ist nicht der gespeicherte — der Link erscheint erst wieder, wenn beides
               übereinstimmt. Ein Link auf einen veralteten Stand wäre die stillste Art zu lügen. -->
          <p id="open-stale" class="hint warn" data-i18n="openStale" hidden></p>
          <p class="hint" data-i18n="webSession"></p>
        </section>
        <!-- CHR-02, Pflichtlieferung 4: im Ruhezustand steht das Symbol; der eine Satz (≤ 60
             Zeichen) steht oben in #status. Alle erklärenden Absätze hängen an der Vorschau bzw.
             am gespeicherten Entwurf und erscheinen erst dort.

             JOB 3524 · Lieferung 3 — UND SEITHER EINE HANDLUNG, DENN „NUR DAS SYMBOL" WAR EINE
             SACKGASSE. Nach dem Verwerfen fiel die Leiste hierher zurück, und jeder Weg zu einer
             neuen Übernahme stand im Absatz `instructions` — INNERHALB von `#preview`, also genau
             dann verborgen, wenn er gebraucht wird. Pedi hat deshalb am 10.09. die Erweiterung neu
             gestartet. Der Knopf teilt sich Zuhörer und Beschriftung mit dem in der Erfolgsmeldung
             oben (eine Handlung, zwei Stellen, an denen sie gebraucht wird) und steht nur da, wenn
             es einen Tab gibt, den die Erweiterung schon einmal lesen durfte (`canCapture`). Die
             eine Zeile in `#status` bleibt daneben stehen und nennt die Wege, die auch dann noch
             tragen, wenn der Tab inzwischen weitergezogen ist. -->
        <div id="rest" hidden>
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 6h16"></path><path d="M4 11h16"></path><path d="M4 16h10"></path><path d="M4 21h6"></path></svg>
          <div class="actions"><button type="button" id="neu-rest" data-i18n="newCapture" hidden></button></div>
        </div>
        <!-- JOB 3606 · Befund (a)+(b): DIE NACHFRAGE, DIE ES VORHER NICHT GAB.
             Eine neue Übernahme, die auf einen offenen Vorgang traf, verschwand stumm: `capture()`
             kehrte zurück, BEVOR die Seite gelesen wurde. Sichtbar war davon nur ein Hinweissatz
             ohne Griff — Pedi las „Markierung · nicht vorhanden" und sah den Inhalt einer fremden
             Seite. Hier steht ab jetzt, WELCHE Seite wartet (`#pending-source`, aus `pendingSource`
             des Workers, nie geraten), und die Entscheidung ist ein Griff: ersetzen oder behalten.
             Beide Knöpfe sind echte Wege im Worker — `recapture` liest die wartende Seite, `keep`
             legt die Nachfrage weg und lässt den offenen Vorgang unangetastet. -->
        <div id="pending-capture" class="hint" hidden>
          <p data-i18n="pendingCapture"></p>
          <p id="pending-source" hidden></p>
          <div class="actions">
            <button type="button" id="pending-replace" data-i18n="pendingReplace"></button>
            <button type="button" id="pending-keep" data-i18n="pendingKeep"></button>
          </div>
        </div>
        <!-- Nacharbeit 2 (Ben): gleichzeitig ausgelöste Erfassungen, die der Worker verdrängen musste,
             ohne sie zu lesen. Sie werden GEZÄHLT und hier genannt, bis der Mensch die Lage
             beantwortet (behalten, ersetzen, verwerfen) — nie still verworfen. -->
        <p id="skipped-captures" class="hint warn" hidden><span data-i18n="skippedCaptures"></span> <span id="skipped-count"></span></p>
        <!-- JOB 3606 R2: Der Konto-Block klappt zu — das ist die Kompaktheit, die `<details>` OHNE
             eine einzige CSS-Zeile mitbringt.
             R4: und er trägt seine Überschrift wieder, wie in der gemessenen 0.4.1. Sie steht
             `sr-only`, also für die Vorlesestimme und nicht für die Fläche — ein `<summary>` ist
             keine Überschrift, wer mit Überschriften durch die Leiste springt, fände den Block
             sonst nicht. Sichtbar stünde er doppelt da. Bis Runde 3 fehlte er ganz, weil
             `.sr-only` in `panel.css` wohnt und diese Datei nicht in den Zielpfaden stand. -->
        <details id="account-details" class="account-details"><summary data-i18n="account"></summary>
          <h2 id="account-title" class="sr-only" data-i18n="account"></h2>
          <p id="account"></p>
          <p class="hint">https://app.klarwerk.ai</p>
          <form id="login-form">
            <label for="email" data-i18n="email"></label><input id="email" type="email" autocomplete="username" required maxlength="320" />
            <label for="password" data-i18n="password"></label><input id="password" type="password" autocomplete="off" required maxlength="1024" />
            <button type="submit" id="login" data-i18n="login"></button>
          </form>
          <button type="button" id="logout" data-i18n="logout" hidden></button>
        </details>
        <!-- BPA-01: DIE KONTEXTKARTE. Welche Seite und welche Markierung Klara gerade kennt — und
             wenn nicht, warum nicht und was als Nächstes geht. Verborgen, solange es weder Karte
             noch Sperre gibt. Inhalte setzt `panel.js` ausschliesslich als Text. -->
        <section id="kontext" aria-labelledby="kontext-title" hidden>
          <h2 id="kontext-title" data-i18n="kontextTitel"></h2>
          <dl id="kontext-karte" hidden><dt data-i18n="kontextBrowser"></dt><dd id="kontext-browser"></dd><dt data-i18n="page"></dt><dd id="kontext-seite"></dd><dt data-i18n="kontextAuswahl"></dt><dd id="kontext-auswahl"></dd><dt data-i18n="captured"></dt><dd id="kontext-zeit"></dd></dl>
          <p id="kontext-tabelle" class="hint" data-i18n="kontextTabelle" hidden></p>
          <p id="kontext-luecken" class="hint" data-i18n="kontextNichtGeliefert" hidden></p>
          <p id="kontext-rahmen" class="hint" data-i18n="kontextRahmen" hidden></p>
          <p id="kontext-verbunden" class="hint" data-i18n="kontextVerbunden" hidden></p>
          <p id="kontext-veraltet" class="hint warn" data-i18n="kontextVeraltet" hidden></p>
          <p id="kontext-import" class="hint" data-i18n="kontextImportBleibt" hidden></p>
          <p id="kontext-sperre" class="hint warn" hidden></p>
          <p id="kontext-schritt" class="hint" hidden></p>
          <div class="actions"><button type="button" id="kontext-verbinden" data-i18n="kontextVerbinden"></button><button type="button" id="kontext-erklaeren" data-i18n="kontextErklaeren" disabled></button><button type="button" id="kontext-widerrufen" data-i18n="kontextWiderrufen"></button><button type="button" id="kontext-begleiter" data-i18n="kontextBegleiter" disabled></button></div>
          <!-- AC10: der Klara-Begleiter auf diesem Mac (Native Messaging) — mit seinen Fassungen. -->
          <p id="kontext-begleiter-stand" class="hint" hidden></p>
          <!-- Klaras Antwort gilt für genau diese Markierung und Fassung; der Worker liefert sie nur
               dann. Der Text wird ausschliesslich als Text gesetzt. -->
          <div id="kontext-antwort-box" aria-live="polite" hidden>
            <h3 data-i18n="kontextAntwortTitel"></h3>
            <p id="kontext-lage" class="hint" hidden></p>
            <ul id="kontext-einschraenkungen" class="hint" hidden></ul>
            <p id="kontext-antwort" hidden></p>
            <div id="kontext-absaetze" hidden></div>
            <p id="kontext-antwort-leer" class="hint" data-i18n="kontextAntwortLeer" hidden></p>
            <div id="kontext-quellen-box" hidden>
              <h4 data-i18n="kontextQuellenTitel"></h4>
              <ul id="kontext-quellen"></ul>
            </div>
            <p class="hint" data-i18n="kontextAntwortHinweis"></p>
          </div>
        </section>
        <!-- BPA-03: AUF DIESER SEITE AUSFÜHREN. Der Auftrag (getippt oder gesprochen) für die Seite,
             die mit der Klickgeste freigegeben ist; darunter der tatsächliche Stand jedes Schritts,
             Klärung oder Übergabe, die Bestätigung vor einer Außenwirkung und — nur wo sie wirklich
             möglich ist — die Rücknahme. Alles kommt vom Kern; `panel.js` setzt es nur als Text. -->
        <section id="aktion" aria-labelledby="aktion-title" hidden>
          <h2 id="aktion-title" data-i18n="aktionTitel"></h2>
          <p id="aktion-ziel" class="hint" hidden></p>
          <label for="aktion-wortlaut" data-i18n="aktionAuftrag"></label>
          <textarea id="aktion-wortlaut" rows="4" maxlength="2000"></textarea>
          <p id="aktion-quelle" class="hint" data-i18n="aktionGesprochen" hidden></p>
          <p id="aktion-hoeren" class="hint" role="status" data-i18n="aktionHoert" hidden></p>
          <div class="actions"><button type="button" id="aktion-ausfuehren" data-i18n="aktionAusfuehren"></button><button type="button" id="aktion-sprechen" data-i18n="aktionSprechen" hidden></button></div>
          <p id="aktion-hinweis" class="hint warn" hidden></p>
          <div id="aktion-zuordnung" role="group" aria-labelledby="aktion-hinweis" hidden>
            <dl id="aktion-zuordnung-werte"></dl>
            <div class="actions"><button type="button" id="aktion-zuordnung-ok"></button></div>
          </div>
          <div id="aktion-stand-box" hidden>
            <p id="aktion-stand" role="status" aria-live="polite"></p>
            <ol id="aktion-schritte"></ol>
            <p id="aktion-klaerung" class="hint warn" hidden></p>
            <p id="aktion-uebergabe" class="hint warn" role="alert" hidden></p>
            <div id="aktion-bestaetigung" role="alertdialog" aria-labelledby="aktion-bestaetigung-text" hidden>
              <p id="aktion-bestaetigung-text"></p>
              <dl id="aktion-bestaetigung-werte"></dl>
              <div class="actions"><button type="button" id="aktion-bestaetigen"></button><button type="button" id="aktion-nicht-ausloesen" data-i18n="aktionNichtAusloesen"></button></div>
            </div>
            <p id="aktion-bestaetigt" class="hint" hidden></p>
            <p id="aktion-ruecknahme-text" class="hint" hidden></p>
            <div class="actions"><button type="button" id="aktion-pause" data-i18n="aktionPause" hidden></button><button type="button" id="aktion-fortsetzen" data-i18n="aktionFortsetzen" hidden></button><button type="button" id="aktion-abbrechen" data-i18n="aktionAbbrechen" hidden></button><button type="button" id="aktion-ruecknahme" hidden></button></div>
          </div>
        </section>
        <!-- JOB 3524 · Lieferung 5: DIE REIHENFOLGE DER FLÄCHE.
             Inhaltsquelle wählen · Inhalt des GEWÄHLTEN Umfangs · Titel, Vertraulichkeit, kurze
             Quellenangabe · Details (zugeklappt) · Speichern und Verwerfen. Die langen Anleitungs-
             und Technikabsätze wohnen im Aufklapper; konkrete Warnungen (`#ai-chat`,
             `#source-changed`, `#scope-none`, `#gaps-box`, `#image-note`) und die Zustandszeile
             mit den drei Zwischenablage-Ausgängen stehen ausdrücklich NICHT darin. -->
        <section id="preview" aria-labelledby="preview-title" hidden>
          <!-- R4: die Überschrift der Karte bleibt für die Vorlesestimme (die Karte nennt sie in
               `aria-labelledby`), kostet aber keine Zeile Fläche — was in der Karte steht, ist am
               Inhalt zu erkennen. So gemessen in der Rettungsfassung 0.4.1. -->
          <h2 id="preview-title" class="sr-only" data-i18n="preview"></h2>
          <p id="ai-chat" class="badge" data-i18n="aiChat" hidden></p>
          <p id="source-changed" class="hint" data-i18n="sourceChanged" hidden></p>
          <fieldset id="scope-box">
            <legend data-i18n="scope"></legend>
            <label class="choice"><input type="radio" name="mode" id="mode-selection" value="selection" /><span><span data-i18n="modeSelection"></span> <span class="hint" id="info-selection"></span></span></label>
            <label class="choice"><input type="radio" name="mode" id="mode-article" value="article" /><span><span data-i18n="modeArticle"></span> <span class="hint" id="info-article"></span></span></label>
            <label class="choice"><input type="radio" name="mode" id="mode-page" value="page" /><span><span data-i18n="modePage"></span> <span class="hint" id="info-page"></span></span></label>
            <!-- JOB 3280 · CHR-06: der vierte Umfang.
                 JOB 3524 · Lieferung 2: er ist WÄHLBAR, bevor etwas eingefügt wurde. Vorher war er
                 gesperrt, solange das Feld leer war — der einzige Weg zu ihm führte über die Taste,
                 die ein Recht anfragt. Die Wahl allein liest nichts und fragt nichts an; sie öffnet
                 das Feld und setzt den Schreibpunkt hinein, damit Cmd+V bzw. Strg+V sofort wirkt. -->
            <label class="choice"><input type="radio" name="mode" id="mode-clipboard" value="clipboard" /><span><span data-i18n="modeClipboard"></span> <span class="hint" id="info-clipboard"></span></span></label>
            <p id="scope-none" class="hint warn" data-i18n="scopeChoose" hidden></p>
          </fieldset>
          <!-- JOB 3280 · CHR-06 / JOB 3412 — DIE ZWISCHENABLAGE WIRD NUR AUF KLICK GELESEN.
               Keine Pflichtberechtigung im Manifest: `clipboardRead` steht dort ausschliesslich
               unter `optional_permissions`. Kein Lesen der Zwischenablage ohne Klick — der Klick
               auf `#paste` fragt das Recht an; ohne Klick wird weder gefragt noch gelesen. Ein
               erteiltes optionales Recht kann bestehen bleiben (Chrome verwaltet es, bis der
               Mensch es entzieht); „kein Dauerrecht" stand hier bis Runde 2 und war falsch.
               Wird es nicht erteilt, nennt `#status` den Griff, der nachweislich trägt — in dieses
               Feld klicken und mit Cmd+V bzw. Strg+V einfügen. Der frühere Satz an dieser Stelle
               („also fragt Chrome beim ersten Mal selbst") war durch die Liveprobe vom 09.09.
               widerlegt und ist deshalb weg. Der eingefügte Text steht danach in einem Feld, das
               Pedi bearbeiten kann — die Vorschau darunter zieht mit.
               JOB 3524 · Lieferung 2: dieser Block hängt jetzt AM GEWÄHLTEN UMFANG, wie `#origin-box`
               darin. Bei Markierung, Artikel oder Seite ist er weg und drängt weder Inhalt noch
               Aktionen nach unten (Pedis Bildschirmfoto 10.09. 09:01). -->
          <fieldset id="clipboard-box" hidden>
            <legend data-i18n="clipboardTitle"></legend>
            <p class="hint" data-i18n="clipboardHint"></p>
            <button type="button" id="paste" data-i18n="paste"></button>
            <label for="clipboard" data-i18n="clipboardText"></label><textarea id="clipboard" maxlength="200000" rows="6"></textarea>
            <div id="origin-box" hidden>
              <label for="origin" data-i18n="originLabel"></label>
              <select id="origin"><option value="" data-i18n="originNone"></option><option value="ki_chat" id="origin-ki" data-i18n="originKiChat"></option><option value="web" data-i18n="originWeb"></option><option value="eigen" data-i18n="originEigen"></option></select>
              <p class="hint" data-i18n="originHintClip"></p>
            </div>
          </fieldset>

          <p class="source-line"><span data-i18n="source"></span>: <span id="source"></span></p>
          <!-- JOB 3606 R2: `#gaps-box` und `#image-note` stehen hier und NICHT im Aufklapper.
               Die kompakte Umsortierung hatte beide nach `#details` verschoben; das bricht die
               Zusage von JOB 3524 („konkrete Warnungen sind keine Erläuterung"), die
               `tests/chrome-einfuegen-leerzustand/leerzustand-und-umfang.test.ts:201` bewacht —
               was nicht übernommen wurde, darf nicht hinter einem Klick verschwinden. -->
          <div id="gaps-box" hidden><h3 data-i18n="gapsTitle"></h3><ul id="gaps"></ul></div>
          <!-- R4: „Inhalt" ebenso — das Feld darunter ist der Inhalt, ein Etikett darüber sagt
               nichts dazu. Für die Vorlesestimme bleibt es die Überschrift des Abschnitts.
               `#image-note` und `#gaps-box` bleiben SICHTBAR: sie sind Warnungen, keine Etiketten. -->
          <h3 class="sr-only" data-i18n="content"></h3>
          <p id="image-note" class="hint" data-i18n="imageNote" hidden></p>

          <div id="content" class="content" tabindex="0"></div>
          <label for="title" data-i18n="title"></label><input id="title" maxlength="90" />

          <label for="confidentiality" data-i18n="confidentiality"></label>
          <select id="confidentiality"><option value="" data-i18n="open"></option><option value="intern" data-i18n="internal"></option><option value="vertraulich" data-i18n="confidential"></option><option value="streng_vertraulich" data-i18n="strict"></option></select>

          <details id="details">
            <summary data-i18n="detailsTitle"></summary>
            <label for="context" data-i18n="context"></label><textarea id="context" maxlength="4000" rows="3"></textarea>
            <dl><dt data-i18n="page"></dt><dd id="page"></dd><dt data-i18n="captured"></dt><dd id="captured"></dd><dt data-i18n="scopeLabel"></dt><dd id="scope-value"></dd></dl>
            <p class="hint" data-i18n="scopeHint"></p>
            <p class="hint" data-i18n="contentHint"></p>
            <p class="hint" data-i18n="summaryHint"></p>
            <p class="hint" data-i18n="classificationHint"></p>
            <p class="hint" data-i18n="sourceHint"></p>
            <p class="hint" data-i18n="originHint"></p>
            <p class="hint" data-i18n="instructions"></p>
            <p class="hint" data-i18n="sessionHint"></p>
          </details>
          <label class="confirm"><input type="checkbox" id="confirm" /><span data-i18n="confirm"></span></label>
          <div class="actions save-actions"><button type="button" id="save" class="primary" data-i18n="save" disabled></button><button type="button" id="cancel" data-i18n="cancel"></button></div>
        </section>
        <!-- BPA-02: TECHNISCHE DATEN AUS DER MARKIERTEN TABELLE. Erscheint nur, wenn die Markierung
             in einer Tabelle stand. Prüfen fragt den Server (regelbasiert, ohne KI); Übernehmen liest
             DENSELBEN Tab neu und gleicht die Fassung mit der geprüften ab, bevor etwas entsteht.
             Alle Werte, Klärungen und Empfehlungen kommen als Text vom Server (`textContent`). -->
        <section id="technik" aria-labelledby="technik-title" hidden>
          <h2 id="technik-title" data-i18n="technikTitle"></h2>
          <p class="source-line"><span data-i18n="technikAbschnitt"></span>: <span id="technik-abschnitt"></span></p>
          <label for="technik-objekt" data-i18n="technikObjekt"></label><input id="technik-objekt" maxlength="200" />
          <label for="technik-variante" data-i18n="technikVariante"></label><input id="technik-variante" maxlength="200" />
          <!-- Nacharbeit 5: die Art DIESES Belegs. Ein verlinktes Datenblatt wird in seinem eigenen
               Tab erfasst, hier als Datenblatt gemerkt und mit der nächsten Prüfung als eigener Beleg
               geführt — getrennte Herkunft, Abweichung und Empfehlung kommen vom Server. -->
          <label for="technik-art" data-i18n="technikArt"></label>
          <select id="technik-art"><option value="html" data-i18n="technikArtHtml"></option><option value="datenblatt" data-i18n="technikArtDatenblatt"></option></select>
          <div class="actions"><button type="button" id="technik-pruefen" data-i18n="technikPruefen"></button><button type="button" id="technik-merken" data-i18n="technikMerken"></button><button type="button" id="technik-abgleichen" data-i18n="technikAbgleichen"></button></div>
          <div id="technik-sammlung-box" hidden>
            <h3 data-i18n="technikSammlung"></h3><ul id="technik-sammlung"></ul>
            <div class="actions"><button type="button" id="technik-leeren" data-i18n="technikLeeren"></button></div>
          </div>
          <!-- Nacharbeit 7: der Abschnitt fehlte bei der frischen Lesung. Die Leiste rät nicht, sie
               fragt — gelöscht (Übernahmen bleiben, als nicht mehr erreichbar gekennzeichnet),
               verschoben (nichts wird gekennzeichnet) oder Zugriff entzogen (Rechteweg, nur Fachprüfung). -->
          <div id="technik-klaerung-box" class="hint warn" hidden>
            <p id="technik-klaerung-frage" data-i18n="technikKlaerungFrage"></p>
            <!-- Nacharbeit 8: die Quelle war gar nicht lesbar (Tab zu, Seite weg, kein Zugriff). -->
            <p id="technik-unlesbar-frage" data-i18n="technikUnlesbarFrage" hidden></p>
            <div class="actions"><button type="button" id="technik-geloescht" data-i18n="technikGeloescht"></button><button type="button" id="technik-verschoben" data-i18n="technikVerschoben"></button><button type="button" id="technik-entzogen" data-i18n="technikEntzogen"></button></div>
            <p class="hint" data-i18n="technikKlaerungHinweis"></p>
          </div>
          <div id="technik-abgleich-box" hidden><h3 data-i18n="technikAbgleich"></h3><ul id="technik-abgleich"></ul></div>
          <div id="technik-ergebnis" hidden>
            <h3 data-i18n="technikBelege"></h3><ul id="technik-belege"></ul>
            <h3 data-i18n="technikWerte"></h3><ul id="technik-werte"></ul>
            <div id="technik-klaerungen-box" hidden><h3 data-i18n="technikKlaerungen"></h3><ul id="technik-klaerungen"></ul></div>
