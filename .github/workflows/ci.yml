name: CI
on:
  push: { branches: [main] }
  pull_request: {}

jobs:
  pflicht-plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      verteilt: ${{ steps.plan.outputs.verteilt }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci --ignore-scripts
      - id: plan
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
        run: node tools/pflicht-pr.mjs plan "$RELEASE_BASE" .local/run/ci-pflicht-plan
      - if: steps.plan.outputs.verteilt == 'true'
        run: npm ci --prefix apps/web
      - name: Web-Bündel für die Testteile wie in tools/build erzeugen
        if: steps.plan.outputs.verteilt == 'true'
        working-directory: apps/web
        timeout-minutes: 4
        env:
          NODE_ENV: production
        run: npx vite build
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.verteilt == 'true'
        with:
          name: pflicht-web-dist-${{ github.sha }}
          path: apps/web/dist/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
      - uses: actions/upload-artifact@v4
        with:
          name: pflicht-auswahl-${{ github.sha }}
          path: .local/run/ci-pflicht-plan/auswahl.json
          if-no-files-found: error
          overwrite: true

  pflicht-teil:
    needs: pflicht-plan
    if: needs.pflicht-plan.outputs.verteilt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pflicht-plan.outputs.matrix || '{"teil":["einzeln"]}') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix apps/web
      - uses: actions/download-artifact@v4
        if: matrix.teil != 'vorstufen'
        with:
          name: pflicht-web-dist-${{ github.sha }}
          path: apps/web/dist/
      - if: matrix.teil == 'schmalansicht'
        run: npx playwright install --with-deps chromium
      - name: Pflichtteil mit denselben Stufen- und Prozessgrenzen
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
          TEIL: ${{ matrix.teil }}
        run: node tools/pflicht-pr.mjs teil "$RELEASE_BASE" .local/run/ci-pflicht-teil "$TEIL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pflicht-pr-${{ github.sha }}-${{ matrix.teil }}
          path: .local/run/ci-pflicht-teil/
          if-no-files-found: error
          overwrite: true

  pflicht:
    needs: [pflicht-plan, pflicht-teil]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - if: github.event_name != 'pull_request' || needs.pflicht-plan.outputs.verteilt == 'false'
        run: npm ci --prefix apps/web
      - uses: actions/download-artifact@v4
        if: github.event_name == 'pull_request' && needs.pflicht-plan.outputs.verteilt == 'true'
        with:
          pattern: pflicht-pr-${{ github.sha }}-*
          path: .local/run/ci-pflicht/teile/
      - name: PR-Auswahl und gegebenenfalls alle Teilbelege prüfen
        if: always() && github.event_name == 'pull_request'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
          PLAN_ERGEBNIS: ${{ needs.pflicht-plan.result }}
          PLAN_VERTEILT: ${{ needs.pflicht-plan.outputs.verteilt }}
          MATRIX_ERGEBNIS: ${{ needs.pflicht-teil.result }}
          LAUF_ABGEBROCHEN: ${{ needs.pflicht-plan.result == 'cancelled' || needs.pflicht-teil.result == 'cancelled' }}
        run: node tools/pflicht-pr.mjs abschluss "$RELEASE_BASE" .local/run/ci-pflicht
      - name: Browserbedarf des Einzelvertrags ermitteln
        id: einzelbrowser
        if: success() && (github.event_name != 'pull_request' || needs.pflicht-plan.outputs.verteilt == 'false')
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node --input-type=module -e '
            import {releaseInputs, schmalansichtsTest} from "./tools/release.mjs";
            const {tests} = releaseInputs(process.cwd(), process.env.RELEASE_BASE);
            console.log("chromium=" + tests.includes(schmalansichtsTest));
          ' >> "$GITHUB_OUTPUT"
      - if: steps.einzelbrowser.outputs.chromium == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.einzelbrowser.outputs.chromium == 'true'
        working-directory: apps/web
        env:
          NODE_ENV: production
        run: npx vite build
      - name: gemeinsamer schneller Pflichtvertrag (maximal 600 Sekunden)
        if: success() && (github.event_name != 'pull_request' || needs.pflicht-plan.outputs.verteilt == 'false')
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/release.mjs check "$RELEASE_BASE" .local/run/ci-pflicht
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pflicht-${{ github.sha }}
          path: .local/run/ci-pflicht/
          if-no-files-found: error
          overwrite: true
  # I51 (OFFEN.md): DIESER JOB PRÜFTE ZWEI WOCHEN LANG EINE ANDERE PIPELINE ALS DAS SHIP-TOR.
  #
  # Hier standen `npm run build`, `lint`, `arch` und `test` als Viererliste. `./tools/check` ruft
  # dieselben Werkzeuge auf — PLUS den hermetischen Chromium-UI-Smoke. Der Kommentar in
  # `tools/check` benannte das seit mega24 selbst: „CI fährt ihn bis heute nicht." Damit hat nichts
  # in der Automatisierung diese Smoke-Suite je ausgeführt; sie war rund fünfzehn Runden rot,
  # während das Tor grün meldete.
  #
  # Ein Unterschied war nicht nur organisatorisch, sondern wirksam: `tools/test:15` setzt
  # `export KLARWERK_SKIP_KEYCHAIN="${KLARWERK_SKIP_KEYCHAIN:-1}"`. `npm run test` ist blankes
  # `vitest run` ohne diese Variable — in CI lief damit ein anderer Zweig des Produktcodes als bei
  # jedem lokalen Lauf. Der Aufruf des Gesamttors schließt das mit.
  #
  # Und der Punkt, der schwerer wiegt als ein roter Lauf: die Regel unten in dieser Datei sagt
  # „Nichts kommt nach main, das diese Pipeline nicht grün durchläuft." Solange das Ship-Tor eine
  # andere Pipeline prüfte, stand die Regel in der Datei, die niemand als Maßstab nahm.
  #
  # Der Vertrag dazu ist `tests/app/ci-check-contract.test.ts`: er wird rot, sobald hier wieder
  # Einzelkommandos stehen oder die Browser-Provisionierung verschwindet.
  # Nachgelagerte Diagnose: Root, binnen 24 Stunden; kein Pflichtgrün aus diesem Job.
  check:
    runs-on: ubuntu-latest
    needs: integration-insel-macos
    if: ${{ always() }}
    env:
      KLARWERK_CI_KLARA_MACOS_COMMIT: ${{ needs.integration-insel-macos.outputs.klara_commit }}
      KLARWERK_CI_KLARA_MACOS_ERGEBNIS: ${{ needs.integration-insel-macos.result }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Erfolgreichen macOS-Nachweis dieses Checkouts prüfen
        run: node tools/klara-macos.mjs --nachweis
      - run: npm ci
      - run: npm ci --prefix apps/web
      # `--with-deps` ist der Unterschied zum lokalen `npm run smoke:browser:setup`: der Runner
      # bringt die Systembibliotheken der Browser nicht mit. Ohne diesen Schritt bricht das Tor
      # unten am fehlenden Browser ab — bewusst mit Fehler, denn `tools/check` kennt kein „skip,
      # wenn ein Browser fehlt". Seit Aufnahme 20260922 fährt das Tor drei Engines (Chromium mit
      # der vollen Suite, Firefox und WebKit je mit den Kern-Rauchproben), deshalb stehen hier alle drei.
      - name: browser (Chromium, Firefox, WebKit für den hermetischen UI-Smoke)
        run: npx playwright install --with-deps chromium firefox webkit
      # Dasselbe Tor wie an der Hand: Build, Lint, Architektur, Tests UND der Drei-Engine-Smoke —
      # hermetisch, ohne Modell und ohne Egress (`smoke:ui:gate*`, nicht `smoke:ui`).
      - name: gate (./tools/check — dasselbe Gesamttor wie lokal)
        run: ./tools/check

  # SCRUM-496: der schnelle Gate-Lauf oben prüft nur JS/Referenzen — ein SQL-Syntaxfehler im
  # migrate()-DDL (z. B. reservierter Tabellenname) fiel dort NICHT auf und brach erst beim
  # Prod-Boot ab. Dieser Job fährt die Integrationstests (migrate() + App gegen echtes Postgres
  # via Testcontainers; Docker ist auf ubuntu-latest vorhanden). Gezieltes Rot bleibt rot; die
  # unabhängige breite Diagnose läuft trotzdem, solange der Lauf nicht abgebrochen wurde.
  # Der schnelle Pflichtjob des exakten Commits entscheidet über den Deploy.
  #
  # Der Integrationsjob bleibt getrennt. Beide Jobs benötigen Root- und Web-Abhängigkeiten:
  # Integrationstests importieren auch Webmodule und führen den gemeinsamen Typecheck aus.
  integration:
    needs: [integration-insel-macos, integration-kundeninstallation]
    if: ${{ !cancelled() }}
    env:
      KLARWERK_PG_PFLICHT: "1"
    # Dump/Restore brauchen passende PostgreSQL-16-Werkzeuge; Ubuntu 26 bringt PostgreSQL 18.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: klarwerk_ci
          POSTGRES_PASSWORD: fiktiv-ci-postgres
          POSTGRES_DB: klarwerk_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U klarwerk_ci -d klarwerk_ci_test"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix apps/web
      - name: browser (Chromium für die Postgres-Browser-Integration)
        run: npx playwright install --with-deps chromium
      - name: gezielte berührte PG-Verträge (vor der langen Diagnose)
        id: pg_gezielt
        env:
          KLARWERK_CI_INSEL_COMMIT: ${{ needs.integration-insel-macos.outputs.commit }}
          KLARWERK_CI_INSEL_ERGEBNIS: ${{ needs.integration-insel-macos.result }}
          KLARWERK_CI_KUNDENINSTALLATION_COMMIT: ${{ needs.integration-kundeninstallation.outputs.commit }}
          KLARWERK_CI_KUNDENINSTALLATION_ERGEBNIS: ${{ needs.integration-kundeninstallation.result }}
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          KLARWERK_PG_TEST_URL: "postgresql://klarwerk_ci:fiktiv-ci-postgres@localhost:5432/klarwerk_ci_test"
        run: node tools/pg-auswahl.mjs "$RELEASE_BASE" .local/run/ci-pg-gezielt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pg-gezielt-${{ github.sha }}
          path: .local/run/ci-pg-gezielt/
          if-no-files-found: error
      - name: integration (Postgres via Testcontainers)
        if: ${{ !cancelled() && (steps.pg_gezielt.outcome == 'success' || steps.pg_gezielt.outcome == 'failure') }}
        env:
          KLARWERK_PG_TEST_URL: "postgresql://klarwerk_ci:fiktiv-ci-postgres@localhost:5432/klarwerk_ci_test"
        run: npm run test:integration

  integration-insel-macos:
    runs-on: macos-15
    outputs:
      commit: ${{ steps.insel_checkout.outputs.commit }}
      klara_commit: ${{ steps.klara.outputs.commit }}
    env:
      KLARWERK_INSEL_LAUNCHD_PFLICHT: "1"
    steps:
      - uses: actions/checkout@v4
        id: insel_checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix apps/web
      - name: Klara für macOS bauen und die native Fensterlogik ausführen
        id: klara
        run: node tools/klara-macos.mjs
      - run: npx playwright install chromium
      - run: npm run test:integration -- tests/insel-auslieferung/release-update-rueckfall.integration.test.ts

  integration-kundeninstallation:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.installation_checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        id: installation_checkout
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration -- tests/neuinstallation/kundeninstallation-strecke.integration.test.ts

  # R-1487 (aufnahme:20260922:gesamt-kundenbetrieb): DAS AUSLIEFERUNGSABBILD ENTSTEHT AUTOMATISCH.
  #
  # Bis hierher entstand das Container-Abbild nur von Hand oder beim Bau durch Coolify, und niemand
  # konnte sagen, aus welchem Stand. Dieser Job fährt bei jedem Lauf den versionierten Bauer
  # `scripts/deploy/abbild-bauen.mjs`: er baut GENAU den ausgecheckten Commit aus `git archive`
  # (Version aus dessen `package.json`), schreibt `docker save`-Archiv, `.sha256` und die
  # Nachweisdatei (Abbildname, Abbildkennung, Version, Commit, Prüfsumme) nach `dist/abbild/`, und
  # dieser Ordner wird als EIN Laufartefakt hochgeladen — Abbild, Prüfsumme und Fassungsnachweis
  # zusammen.
  #
  # KEINE VERÖFFENTLICHUNG: kein `docker login`, kein `docker push`, kein Registry-Geheimnis. Der
  # Bauer ruft nur `build`, `image inspect` und `save` (`tests/kundenbetrieb-betriebsmodelle/
  # abbild-bauen.test.ts`). `needs: pflicht`: gebaut wird nur nach dem schnellen Pflichtvertrag.
  # Der Bauer braucht nur Node, git, tar und docker (auf ubuntu-latest vorhanden) — kein `npm ci`.
  abbild:
    needs: pflicht
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: abbild (Container aus dem Commit, mit Prüfsumme, ohne Veröffentlichung)
        run: node scripts/deploy/abbild-bauen.mjs --ziel dist/abbild
      - name: Laufartefakt (Abbild, Prüfsumme, Fassungsnachweis)
        uses: actions/upload-artifact@v4
        with:
          name: klarwerk-abbild-${{ github.sha }}
          path: dist/abbild/
          if-no-files-found: error
          retention-days: 14
# Versandfreigabe: der jüngste exakte Commit braucht pflicht=success. Lange Diagnosen bleiben sichtbar.
