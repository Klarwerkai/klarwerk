<!doctype html>
<!-- WP-KLARA-1: Klara in Word — selbstenthaltendes Taskpane (kein React, kein Build). Läuft auf der
     App-Domain (public/ wird statisch mitgeliefert) → API-Aufrufe sind same-origin (Session-Cookie).
     WP-KLARA-ASK (Pedis Entscheid 22.07., bens Option B): zwei ehrliche Faehigkeiten — (1) Klara
     FRAGEN: markierte Aussage (oder freie Frage) gegen den BESTEHENDEN Konsolen-Vertrag
     POST /api/ask — Antworten kommen AUSSCHLIESSLICH aus validiertem Werkswissen mit Quellen;
     ohne Grundlage bleibt die Frage ehrlich offen (Wissensluecke, kein Chatbot, nichts erfunden).
     (2) Wissen ERFASSEN: Auswahl/Dokument als KLARWERK-ENTWURF senden (kein Auto-Speichern als
     fertiges Wissensobjekt). Kein Add-in-eigener Modellaufruf — die Frage reist wie jede
     Konsolen-Frage zum Server, dessen Routing unveraendert gilt. -->
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Klara — KLARWERK</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    /* ============================================================================================
       AUFTRAG-mega43 BLOCK A — KLARA TRAEGT DIE WERKBANK-PALETTE.
       ============================================================================================
       Bis mega42 fuehrte dieses Panel eine EIGENE, unverbundene Palette: Hauptakzent #5b50c4
       (Violett) auf Knoepfen, Links und aktiver Sprache, Flaeche #f7f7fa (kaltes Blaugrau).
       Violett ist im Web aber die KENNFARBE FUER „KI im Spiel" (--kw-ai) und keine Markenfarbe —
       Klara benutzte also ein Signal als Marke und stand nach mega40-42 farblich allein.

       Die Werte hier kommen Ziffer fuer Ziffer aus apps/web/src/styles/themes.css,
       [data-theme="modern"] (Papier, Nacht und ein Funke). Nichts ist neu gewaehlt. Sie stehen als
       Hex statt als Kanal-Tripel, weil das Panel buildlos ist (kein Tailwind, kein Import) — es
       MUSS eine Kopie sein. Gegen genau diese Kopie steht ein Sammler:
       tests/app/mega43-klara-werkbank-palette.test.ts liest beide Dateien, rechnet die Tripel nach
       Hex um und verlangt Gleichheit; er misst ausserdem den Kontrast der texttragenden Paare.

       NUR Darstellung: kein Element, kein Text, keine id/data-t, kein Verhalten hat sich geaendert. */
    :root {
      /* Flaechen und Tinte */
      --page: #FAF8F5; /* Papier ← --kw-page */
      --surface: #FFFFFF; /* Karte ← --kw-surface */
      --ink: #0E1626; /* Nacht ← --kw-ink / --kw-night (Ueberschriften UND Kopfzeilen-Band) */
      --text: #1A2233; /* Tinte ← --kw-text */
      --muted: #525B6B; /* Tinte-2 ← --kw-muted */
      --hairline: #E9E5DE; /* Linie ← --kw-hairline */

      /* Marke: der Funke. Drei Rollen, drei Token — wie im Web, aus demselben Grund:
         #E8630A traegt Weiss nur mit 3,38:1 (Flaeche/Strich, kein Text), #C2500A traegt Weiss mit
         4,72:1 (Knopfflaeche), und als TEXT auf Papier liegt #C2500A bei 4,45:1 — deshalb dort
         --kw-brand-text (AUFTRAG-mega62 Block D: #9C5009, 5,56:1 auf Papier — vorher #A8560A mit
         4,95:1), das der modern-Block ABSICHTLICH nicht ueberschreibt (themes.css). */
      --brand: #E8630A; /* Funke ← --kw-brand */
      --brand-deep: #C2500A; /* Funke dunkel ← --kw-funke-deep */
      --brand-text: #9C5009; /* Funke als Text ← --kw-brand-text (im modern-Thema wirksam) */

      /* Kopfzeilen-Band ← --kw-shell-* */
      --shell-fg: #FAF8F5; /* Papier-Inhalt auf Nacht ← --kw-shell-fg */
      --shell-muted: #7E879A; /* Meta auf Nacht ← --kw-shell-muted-2 */

      /* Trust — nur Reife/Status */
      --pos-bg: #E0F1E7; /* ← --kw-trust-pos-bg */
      --pos-text: #116B3C; /* ← --kw-trust-pos-text */
      --warn-bg: #FDF1D7; /* ← --kw-trust-warn-bg */
      --warn-text: #8A5A00; /* ← --kw-trust-warn-text */

      /* Elevation: weiches Licht statt hartem Rahmen ← --kw-shadow-tile */
      --shadow-tile: 0 1px 2px rgba(14, 22, 38, 0.05), 0 8px 24px -12px rgba(14, 22, 38, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--page);
      color: var(--text);
      /* Kein Webfont: der IBM-Plex-Stapel des Webs waere ein neuer Egress aus dem Word-Panel.
         Der System-Stapel bleibt — die Werkbank-Anmutung traegt die Palette, nicht die Schrift. */
      font: 14px/1.5 -apple-system, "Segoe UI", system-ui, sans-serif;
      padding: 14px;
    }
    /* Die Kopfzeile als durchgehendes Nachtblau-Band (wie die Topbar im Web). Die negativen
       Aussenabstaende heben die 14px Koerper-Polsterung auf — reine Darstellung, kein DOM-Eingriff. */
    header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin: -14px -14px 0;
      padding: 12px 14px;
      background: var(--ink);
    }
    .brand { font-size: 18px; font-weight: 700; color: var(--shell-fg); }
    .brand small { color: var(--shell-muted); font-weight: 500; font-size: 11px; margin-left: 6px; }
    .lang button {
      border: 1px solid var(--shell-muted);
      background: transparent;
      color: var(--shell-muted);
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 999px;
      cursor: pointer;
    }
    .lang button.active {
      color: var(--surface);
      background: var(--brand-deep);
      border-color: var(--brand-deep);
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--hairline);
      border-radius: 10px;
      padding: 12px;
      margin-top: 12px;
      /* weiches Licht statt hartem Rahmen: der Rahmen bleibt als hauchduenne Linie stehen,
         die Tiefe kommt aus dem Schatten-Rezept des modern-Themas. */
      box-shadow: var(--shadow-tile);
    }
    /* Abschnittsueberschriften: die Kicker-Token des modern-Themas (--kw-kicker-*), NICHT die
       Mono-Versalien — die hat mega40 BLOCK C im Web ausdruecklich abgeschafft. */
    h2 { font-size: 13px; margin: 0 0 6px; color: var(--ink); font-weight: 600; letter-spacing: 0.02em; }
    p { margin: 6px 0; }
    .muted { color: var(--muted); font-size: 12.5px; }
    button.primary {
      background: var(--brand-deep);
      color: var(--surface);
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 2px 10px -2px rgba(232, 99, 10, 0.45);
    }
    button.primary:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
    button.ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12.5px;
      cursor: pointer;
    }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .status { border-radius: 8px; padding: 8px 10px; font-size: 12.5px; margin-top: 8px; }
    .status.ok { background: var(--pos-bg); color: var(--pos-text); }
    .status.warn { background: var(--warn-bg); color: var(--warn-text); }
    .hidden { display: none; }
    ul { margin: 6px 0; padding-left: 18px; }
    a { color: var(--brand-text); }
    /* WP-KLARA-ASK (Teil 3): zwei klar getrennte Bereiche — iPad-einfach, kein Framework.
       mega43: Unterstreichung statt gefuellter Knoepfe. */
    .tabs { display: flex; gap: 6px; margin-top: 12px; border-bottom: 1px solid var(--hairline); }
    .tabs button {
      flex: 1;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 600;
      padding: 8px 0 6px;
      border-radius: 0;
      cursor: pointer;
    }
    .tabs button.active { color: var(--brand-text); border-bottom-color: var(--brand); }
    textarea {
      width: 100%;
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 8px;
      font: inherit;
      resize: vertical;
      margin: 6px 0 8px;
    }
    .answer-text { white-space: pre-wrap; }
    /* Die Quellen-/Belegzeile traegt den linken Funke-Balken (Beleg-Motiv des Webs). Die weiche
       Markenflaeche #FDEADD blieb hier bis mega61 ABSICHTLICH weg: der Marken-Textton mass auf ihr
       nur 4,497:1 und fiel damit unter AA — die Quellen sind Links. AUFTRAG-mega62 Block D hat
       genau das behoben (#9C5009 misst auf #FDEADD 5,046:1); der Balken bleibt trotzdem, weil er
       das Beleg-Motiv des Webs spiegelt — die Flaeche waere jetzt nur ERLAUBT, nicht noetig.
       KEIN display hier: #ask-sources-block wird per .hidden geschaltet (id schlaege die Klasse). */
    #ask-sources-block {
      margin-top: 10px;
      padding: 2px 0 2px 10px;
      border-left: 3px solid var(--brand);
    }
    /* K3: Status-Badge je Antwort-Quelle — gleiche Ampel-Semantik wie die Bibliothek
       (validiert=gruen, in Pruefung=warn, offen/unbekannt=neutral). */
    .src-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 7px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
      border: 1px solid var(--hairline);
      background: var(--surface);
      color: var(--muted);
      vertical-align: middle;
    }
    .src-badge-validiert { background: var(--pos-bg); color: var(--pos-text); border-color: transparent; }
    .src-badge-pruefung { background: var(--warn-bg); color: var(--warn-text); border-color: transparent; }
  </style>
</head>
<body>
  <header>
    <div class="brand">Klara<small>KLARWERK</small></div>
    <div class="lang" role="group" aria-label="Sprache">
      <button type="button" id="lang-de" class="active">DE</button>
      <button type="button" id="lang-en">EN</button>
      <button type="button" id="lang-nl">NL</button>
    </div>
  </header>

  <div class="card" id="session-card">
    <h2 data-t="greetTitle"></h2>
    <p class="muted" data-t="greetBody"></p>
    <div id="session-status" class="status warn" data-t="sessionChecking"></div>
    <div id="login-block" class="hidden">
      <p class="muted" data-t="loginHint"></p>
      <button type="button" class="primary" id="login-btn" data-t="loginCta"></button>
      <!-- WP-KLARA-1c: sichtbar nur waehrend des Anmelde-Wartens (Session-Polling laeuft). -->
      <button type="button" class="ghost hidden" id="login-cancel-btn" data-t="loginCancel"></button>
      <!-- WP-IC-PAKET-1c (g): ehrlicher Hinweis NUR im Fallback-Fall (window.open statt Office-Dialog):
           das Anmelde-Fenster kann in einem anderen Browser-Kontext landen. -->
      <p class="muted hidden" id="login-context-hint" data-t="loginOtherContext"></p>
      <p class="muted" data-t="loginReturn"></p>
    </div>
  </div>

  <!-- WP-KLARA-ASK (Teil 3): zwei Bereiche — Fragen (das Funktionsversprechen) und Wissen erfassen
       (der bestehende Entwurf-Sender). Einfache Segment-Knoepfe, kein Framework, buildlos. -->
  <div class="tabs" role="tablist" aria-label="Bereiche">
    <button type="button" id="tab-ask" class="active" data-t="tabAsk"></button>
    <button type="button" id="tab-capture" data-t="tabCapture"></button>
  </div>

  <!-- WP-KLARA-ASK (Teil 1): Klara fragen — Auswahl als Frage, quellengebundene Antwort aus dem
       VALIDIERTEN Werkswissen ueber den BESTEHENDEN Konsolen-Vertrag POST /api/ask (Same-Origin-
       Session; serverseitige Permission ko.read wie in der Fragen-Konsole — kein neuer Guard). -->
  <div id="section-ask">
    <div class="card">
      <h2 data-t="askTitle"></h2>
      <p class="muted" data-t="askHint"></p>
      <!-- AUFTRAG-mega74 TEIL 2b: WAS wirklich gefragt wird — sichtbar VOR dem Fragen. Bis mega74
           schlug eine vorhandene Markierung das Eingabefeld stillschweigend (prepareAskQuestion),
           und wer beides tat, erfuhr nie, dass seine getippte Frage verworfen wurde. -->
      <p id="ask-source-note" class="muted" style="margin: 0 0 4px 0;"></p>
      <textarea id="ask-input" rows="3"></textarea>
      <!-- AUFTRAG-mega61 Block E: der dauerhaft sichtbare Satz, ohne Aufklappen, VOR der ersten
           Frage. Das Add-in hat kein React und kein gemeinsames i18n — der Wortlaut steht
           deshalb sinngleich in seinem eigenen Woerterbuch (aiGeneratedNotice).

           AUFTRAG-mega81 BLOCK A (bens ROT zu mega79): hier stand EIN Absatz, der dauerhaft und
           zustandsunabhaengig „Von kuenstlicher Intelligenz erzeugt" behauptete — unmittelbar UEBER
           der Zeile darunter, die sagt, Klaras Antwort entstehe IMMER ohne KI-Modell. Zwei
           unvereinbare Saetze uebereinander, fuer denselben sichtbaren Antwortweg: der einzige
           Antwortweg dieses Bereichs sendet `mode: "retrieval-only"`, und der Server laesst die
           Kennzeichnung dort BEWUSST weg (answerRetrievalOnly, services/reasoner/src/service.ts).

           Aus einem Absatz sind deshalb zwei geworden:
             1. der fachliche Pruefhinweis — DAUERHAFT, denn er gilt auf diesem Weg unveraendert;
             2. die KI-Kennzeichnung — an das serverseitige `aiGenerated`-Signal GEBUNDEN, also
                heute nie sichtbar und morgen von selbst sichtbar, wenn diese Flaeche einmal einen
                echten Modellweg zeigt. Abgeschaltet ist sie NICHT. -->
      <p class="muted" id="ask-review-notice" data-t="askReviewNotice"></p>
      <p class="muted hidden" id="ask-ai-notice" data-t="aiGeneratedNotice"></p>
      <!-- AUFTRAG-mega75 Block A: WOMIT gearbeitet wird — dieselbe Auskunft, die AiModelInfo in der
           Anwendung gibt, aus demselben oeffentlichen Status. Drei ehrliche Zustaende (extern /
           hausintern / keine) plus die beiden Nicht-Aussagen „wird geprueft" und „nicht abrufbar".
           OHNE Modellname: der oeffentliche Status ist bewusst abstrahiert (WP-VIP2-GATE).

           AUFTRAG-mega79 BLOCK A (bens ROT zu mega77): diese Zeile sagte bei „extern"/„intern",
           fuer KLARAS ANTWORT arbeite eine KI. Das war FALSCH — und zwar in beide Richtungen
           falsch, denn die Verengung von mega77 („ganz KLARWERK" -> „Klaras Antwort") drehte die
           Aussage genau um. Die Ableitung beobachtet die KLARWERK-Aufgabe `answer`; Klaras Antwort
           in diesem Fenster laeuft davon UNABHAENGIG und IMMER ohne Modell (retrieval-only,
           erhoben in tests/app/mega79-klara-antwort-ohne-modell.test.ts).

           WAS DIE ZEILE JETZT TRAGT: zwei unverwechselbar getrennte Aussagen in EINEM Schluessel
           je Sprache — (1) der HAUSSTAND von KLARWERK (Pedis urspruengliches Anliegen: er sah in
           KLARWERK eine KI arbeiten und hier eine Absage) und (2) die EIGENSCHAFT von Klaras
           Antwort, die kein Mangel ist, sondern der Grund, ihr zu trauen. „laedt" und „nicht
           erreichbar" beziehen sich AUSSCHLIESSLICH auf diesen Statusabruf — der Antwortweg ist
           auch ohne jeden Abruf bekannt und steht deshalb in JEDEM der fuenf Zustaende da. -->
      <p class="muted" id="ask-ai-lage"></p>
      <!-- AUFTRAG-mega75 Block C: unter WELCHER REGEL Klara steht. Das ist keine Entschuldigung,
           sondern das Merkmal, das sie vertrauenswuerdig macht — und die Aufloesung von Pedis
           Widerspruch: in KLARWERK arbeitet vielleicht eine KI, hier wird woertlich zitiert.
           Dauerhaft sichtbar, also bei JEDER Antwort und JEDER Absage.

           AUFTRAG-mega77 Block B: hier stand zusaetzlich „und der markierte Text verlaesst das
           Haus nicht" (EN „never leaves your organisation", NL „verlaat het huis niet"). Das ist
           ENTFERNT. Retrieval-only beweist, dass der markierte Text nicht an Modell oder Embedder
           geht — es beweist NICHT, wo der KLARWERK-Server steht. Der Text geht per HTTP an ihn.
           Eine Aussage ueber Serverstandort oder Organisationsgrenze ist eine BETRIEBSZUSAGE, die
           dieser Code nicht erzwingt; belegt ist nur, dass keine EXTERNE KI ihn bekommt. -->
      <p class="muted" id="ask-rule-note" data-t="askRuleNote"></p>
      <button type="button" class="primary" id="ask-btn" data-t="askCta" disabled></button>
      <div id="ask-status" class="status hidden"></div>
      <div id="ask-answer-block" class="hidden">
        <h2 data-t="askAnswerTitle" style="margin-top: 12px;"></h2>
        <!-- AUFTRAG-mega34 B2: die Einstufung, sichtbar VOR dem Antworttext. Bis mega33 stand hier
             nur eine unbedingte Zusage („geprueftes Wissen"), die auch bei gedeckelter Abdeckung
             galt. Der Text kommt aus derselben Auswahl wie der ausgegebene Hinweis.
             AUFTRAG-mega35 B: die Ueberschrift ist neutral („Quellengebundene Antwort") — die
             Worte „gesichert"/„geprueft" stehen NUR noch in dieser Einstufungszeile. -->
        <p id="ask-evidence-note" class="status hidden" style="margin: 0 0 8px;"></p>
        <!-- klara1b Teil B: editierbares, kompaktes Feld VOR dem Eintragen. AUFTRAG-mega35 A1: das
             Feld traegt NUR den Antwortkoerper — Einstufung und Quellen-Zeile gehoeren nicht dazu
             und werden erst im Moment des Kopierens/Einfuegens angesetzt (composeOutputText); sie
             koennen also weder gekuerzt noch verloren werden. Ist die Antwort lang, klappt
             „mehr anzeigen" das Feld auf. -->
        <p class="muted" id="ask-answer-edit-hint" data-t="askAnswerEditHint" style="margin-bottom: 4px;"></p>
        <textarea id="ask-answer-edit" class="answer-text" rows="4"></textarea>
        <button type="button" class="ghost hidden" id="ask-answer-toggle" style="margin: 0 0 8px;"></button>
        <div style="display: flex; gap: 6px;">
          <!-- Teil 2 (Gating): NUR bei echter quellengebundener Antwort UND bereitem Office aktiv. -->
          <button type="button" class="primary" id="ask-insert-btn" data-t="askInsertCta"></button>
          <!-- klara1b Teil B: Ausweg „Kopieren" — braucht kein Office, greift auch bei Rechte-Fehler. -->
          <button type="button" class="ghost" id="ask-copy-btn" data-t="askCopyCta"></button>
        </div>
        <!-- AUFTRAG-mega36 B3: der Fehler-Rueckfall der Zwischenablage. Bis mega35 forderte er die
             Nutzerin auf, „den Text im Feld zu markieren und manuell zu kopieren" — also genau den
             ROHEN Antwortkoerper ohne Einstufung und Quellen-Zeile. Stattdessen steht hier der
             VOLLSTAENDIGE abgeleitete Text als nur lesbares Feld bereit (vorausgewaehlt); nur der
             wird zum Kopieren angeboten. -->
        <div id="ask-copy-fallback" class="hidden" style="margin-top: 8px;">
          <p class="muted" id="ask-copy-fallback-hint" data-t="askCopyFallbackHint" style="margin-bottom: 4px;"></p>
          <textarea id="ask-copy-fallback-text" class="answer-text" rows="8" readonly></textarea>
        </div>
        <!-- klara1b Teil B: die Quellenliste bleibt (Titel-Link, Status/Trust-Badge) — aber
             GETRENNT vom einzufuegenden Antworttext (nur Anzeige, wandert nie ins Dokument). -->
        <div id="ask-sources-block" class="hidden">
          <h2 data-t="askSourcesTitle"></h2>
          <ul class="muted" id="ask-sources"></ul>
        </div>
      </div>
      <div id="ask-gap-block" class="hidden">
        <div class="status warn">
          <strong data-t="askGapTitle"></strong>
          <p class="muted" data-t="askGapBody" style="margin-bottom: 0;"></p>
          <!-- AUFTRAG-mega77 Block A: hier stand der Satz aus mega74 Teil 2b mit der Zahl der
               unterdrueckten ungeprueften Treffer. Er ist ENTFERNT — die Zahl entstand ohne
               Betrachterfilter (Leck ab n = 1) und zaehlte die gedeckelte Vorauswahl statt des
               Bestands. Was bleibt, ist die ehrliche Wissensluecke ohne Auskunft ueber fremden
               Bestand. -->
          <!-- AUFTRAG-mega75 Block C: die Absage ist der Moment, in dem der Mensch „warum nicht?"
               fragt — hier steht die Regel deshalb ein zweites Mal, im selben Wortlaut aus dem
               selben Schluessel (eine Quelle, kein zweiter Text). -->
          <p class="muted" data-t="askRuleNote" style="margin: 6px 0 0 0;"></p>
        </div>
        <button type="button" class="primary" id="ask-gap-send-btn" data-t="askGapSendCta" style="margin-top: 8px;"></button>
        <p id="ask-gap-open-block" class="hidden">
          <a id="ask-gap-open-link" href="https://app.klarwerk.ai/erfassen" target="_blank" rel="noopener" data-t="askGapOpenLink"></a>
        </p>
      </div>
    </div>
  </div>

  <div id="section-capture" class="hidden">
  <div class="card">
    <h2 data-t="sendTitle"></h2>
    <p class="muted" data-t="sendHint"></p>
    <!-- WP-KLARA-2 (Pedis Befund 3): Umfangs-Wahl. Seiten-Optionen sind EHRLICH deaktiviert —
         Word-JS bietet im Taskpane-Kontext kein verlaessliches Seiten-API (Begruendung im Test/
         Bericht); der Tooltip erklaert es, der Hinweis nennt den Ausweg (Bereich markieren). -->
    <div class="scope" role="radiogroup" aria-label="Umfang" style="margin:8px 0 4px; display:grid; gap:4px; font-size:12.5px;">
      <label><input type="radio" name="scope" id="scope-selection" checked /> <span data-t="scopeSelection"></span></label>
      <label><input type="radio" name="scope" id="scope-document" /> <span data-t="scopeDocument"></span></label>
      <label id="scope-pages-label" style="color: var(--muted);"><input type="radio" name="scope" id="scope-pages" disabled /> <span data-t="scopePages"></span></label>
    </div>
    <p class="muted" id="scope-pages-hint" data-t="scopePagesHint" style="margin-top:0;"></p>
    <button type="button" class="primary" id="send-btn" data-t="sendCta" disabled></button>
    <!-- WP-KLARA-1b (K5): ehrlicher Zustand, wenn Office.js fehlt/nicht bereit wird (Seite im normalen
         Browser geoeffnet) — statt eines toten oder crashenden Senden-Knopfs. -->
    <div id="office-hint" class="hidden"></div>
    <div id="send-status" class="status hidden"></div>
    <p id="open-block" class="hidden">
      <a id="open-link" href="https://app.klarwerk.ai/erfassen" target="_blank" rel="noopener" data-t="openLink"></a>
    </p>
  </div>
  </div>

  <div class="card">
    <h2 data-t="helpTitle"></h2>
    <ul class="muted">
      <li data-t="helpCan1"></li>
      <li data-t="helpCan2"></li>
      <li data-t="helpCan3"></li>
      <li data-t="helpNot1"></li>

  </div>

  <!-- AUFTRAG-mega69 Block E: der sichtbare Auslieferungsstand. Der Wert entsteht beim Bauen

  <script>
    "use strict";

    var WORD_ADDIN_FALLBACK_TITLE = "Wissens-Entwurf aus Word";
    var WORD_ADDIN_TITLE_MAX = 60;

    function deriveDraftTitleFromSelection(text) {
      var firstLine = "";
      var lines = text.split(/\r?\n/);
      for (var i = 0; i < lines.length; i += 1) {
        var line = lines[i].trim();
        if (line.length > 0) { firstLine = line; break; }

          .replace(/</g, "&lt;")

    var WORD_ADDIN_LOGIN_POLL_MAX_MS = 300000;
    var WORD_ADDIN_LOGIN_FETCH_TIMEOUT_MS = 5000;

    function loginPollDecision(elapsedMs, signedIn) {
      if (signedIn) { return "done"; }

    function loginPollStep(generation, currentGeneration, elapsedMs, signedIn) {
      if (generation !== currentGeneration) { return "stale"; }
      var decision = loginPollDecision(elapsedMs, signedIn);
      return decision === "poll" ? "schedule" : decision;
    }

    // autoritative Saeuberung macht der Server-Sanitizer am bestehenden Draft-Weg.
    var WORD_ADDIN_BODY_BUDGET_BYTES = 3500000;

      var match = /<body[^>]*>([\s\S]*?)<\/body>/i.exec(html);
      var inner = match && match[1] !== undefined ? match[1] : html;
      return inner.replace(/^\s+|\s+$/g, "");

      var imgRe = /<img\b[^>]*>/gi;

      var match = imgRe.exec(html);
      while (match !== null) {
        var srcMatch = /src\s*=\s*(?:"([^"]*)"|'([^']*)')/i.exec(match[0]);
        var src = srcMatch ? (srcMatch[1] !== undefined ? srcMatch[1] : srcMatch[2]) : "";
        src = (src || "").replace(/^\s+|\s+$/g, "");

        match = imgRe.exec(html);

    // AUFTRAG-mega74 TEIL 2 — die Bilder wirklich uebergeben. Anforderungsstufe an der
    // Dokumentation belegt: Body.inlinePictures, InlinePictureCollection und
    // InlinePicture.getBase64ImageSrc() sind alle WordApi 1.1 — das Manifest bleibt bei 1.1.
    // Gemieden, weil hoeher: getFirst() (1.3) und imageFormat (WordApiDesktop 1.1). Der Bildtyp
    // kommt deshalb aus den Bytes. Ausfuehrliche Begruendung im Spiegelmodul lib/wordAddin.ts.
    var WORD_IMAGE_SIGNATURES = [
      { mime: "image/png", prefix: "iVBORw0KGgo" },
      { mime: "image/jpeg", prefix: "/9j/" },
      { mime: "image/gif", prefix: "R0lGOD" },
      { mime: "image/webp", prefix: "UklGR" }
    ];

    // Byte 8 liegt NICHT auf einer Base64-Dreiergrenze — ein Praefixvergleich auf der kodierten
    // Zeichenkette geht schief. Deshalb wird der Kopf wirklich dekodiert; Fehlschlag = kein WEBP.
    function riffIstWebp(base64) {

    function wordImageMimeFromBase64(base64) {
      var clean = String(base64 || "").replace(/^data:[^,]*,/, "").replace(/\s+/g, "");
      if (clean.length === 0) { return null; }
      for (var i = 0; i < WORD_IMAGE_SIGNATURES.length; i += 1) {
        var sig = WORD_IMAGE_SIGNATURES[i];
        if (clean.indexOf(sig.prefix) === 0) {
          if (sig.mime === "image/webp" && !riffIstWebp(clean)) { return null; }
          return sig.mime;
        }

      return null;
    }

    function fillWordImages(html, base64List) {
      var imgRe = /<img\b[^>]*>/gi;
      var tags = [];
      var m = imgRe.exec(html);
      while (m !== null) { tags.push(m[0]); m = imgRe.exec(html); }
      var fehltVorher = countUndeliveredWordImages(html);
      if (tags.length === 0 || tags.length !== base64List.length) {
        return {
          html: html,
          filled: 0,
          remaining: fehltVorher,
          hindernis: tags.length === 0 ? null : "anzahl-passt-nicht"
        };
      }
      var index = -1;
      var filled = 0;
      var out = html.replace(/<img\b[^>]*>/gi, function (tag) {
        index += 1;
        var srcMatch = /src\s*=\s*(?:"([^"]*)"|'([^']*)')/i.exec(tag);
        var src = srcMatch ? (srcMatch[1] !== undefined ? srcMatch[1] : srcMatch[2]) : "";
        src = (src || "").replace(/^\s+|\s+$/g, "");
        if (/^data:image\/(png|jpe?g|gif|webp);base64,/i.test(src)) { return tag; }
        var roh = String(base64List[index] || "").replace(/^data:[^,]*,/, "").replace(/\s+/g, "");
        var mime = wordImageMimeFromBase64(roh);

        var datenUrl = "data:" + mime + ";base64," + roh;
        return srcMatch
          ? tag.replace(/src\s*=\s*(?:"[^"]*"|'[^']*')/i, 'src="' + datenUrl + '"')
          : tag.replace(/^<img/i, '<img src="' + datenUrl + '"');

    }

    function wordHtmlUtf8Bytes(value) {
      return new TextEncoder().encode(value).length;
    }

    // WP-SHIP8-FINAL (bens Bedingung 4): Klartext aus dem EINEN HTML-Snapshot ableiten (kein
    // zweiter Office-Aufruf) + Budget misst den FINALEN JSON-Payload des Draft-POSTs.
    function wordHtmlToPlainText(html) {
      var stripped = extractWordBodyHtml(html || "")
        .replace(/<(script|style)\b[\s\S]*?<\/\1\s*>/gi, "")
        .replace(/<br\s*\/?>/gi, "\n")
        .replace(/<\/(p|div|li|h[1-6]|tr|figcaption|caption|blockquote|pre)\s*>/gi, "\n")
        .replace(/<[^>]+>/g, "");
      var decoded = stripped
        .replace(/&nbsp;/gi, " ")
        .replace(/&lt;/gi, "<")
        .replace(/&gt;/gi, ">")
        .replace(/&quot;/gi, '"')
        .replace(/&#39;/g, "'")
        .replace(/&amp;/gi, "&");
      var out = [];
      var lines = decoded.split(/\r?\n/);
      for (var i = 0; i < lines.length; i += 1) {
        var line = lines[i].replace(/\s+/g, " ").trim();
        if (line.length > 0) { out.push(line); }
      }
      return out.join("\n");
    }

    function draftPostPayload(title, statement, bodyHtml) {
      return JSON.stringify({ title: title, statement: statement, bodyHtml: bodyHtml, origin: "frontdoor" });
    }

    function prepareWordDraftRequest(html, text) {
      var title = deriveDraftTitleFromSelection(text);
      var statement = text.trim().slice(0, 500);
      var inner = extractWordBodyHtml(html || "");
      var undeliveredImages = countUndeliveredWordImages(inner);
      // AUFTRAG-mega45 Block F: plainTextFallback = Word lieferte gar kein verwertbares HTML.
      // Ohne dieses Feld standen `undeliveredImages: 0` und `overBudget: false` gemeinsam auf
      // "alles gut", obwohl Formatierung und Bilder verschwanden — die stille Null. Keine
      // geratene Bildzahl: wo kein HTML ankam, ist jede Zahl erfunden.
      if (inner.length === 0) {
        return { payload: draftPostPayload(title, statement, selectionToBodyHtml(text)), title: title, usedHtml: false, overBudget: false, undeliveredImages: 0, plainTextFallback: true };
      }
      var htmlPayload = draftPostPayload(title, statement, inner);
      if (wordHtmlUtf8Bytes(htmlPayload) > WORD_ADDIN_BODY_BUDGET_BYTES) {
        return { payload: draftPostPayload(title, statement, selectionToBodyHtml(text)), title: title, usedHtml: false, overBudget: true, undeliveredImages: undeliveredImages, plainTextFallback: false };
      }

    // WP-KLARA-ASK: Klara fragen — Frage-Vorbereitung (Auswahl vor Eingabefeld, Deckel 2000),
    // Ask-Lauf gegen POST /api/ask (Fetch injizierbar), Einfuege-Gating, Quellen-Zeile,
    // Offene-Frage-Titel. Verhaltensgleich zum Modul (Aequivalenztest).
    var WORD_ADDIN_ASK_MAX_CHARS = 2000;
    var WORD_ADDIN_ASK_TIMEOUT_MS = 15000;

    function prepareAskQuestion(selectionText, manualText) {
      var selection = (selectionText || "").trim();
      var manual = (manualText || "").trim();
      var from = selection.length > 0 ? "selection" : manual.length > 0 ? "manual" : "empty";
      var raw = from === "selection" ? selection : from === "manual" ? manual : "";
      if (raw.length === 0) { return { question: "", from: "empty", truncated: false }; }
      if (raw.length > WORD_ADDIN_ASK_MAX_CHARS) {
        return { question: raw.slice(0, WORD_ADDIN_ASK_MAX_CHARS).trim(), from: from, truncated: true };
      }
      return { question: raw, from: from, truncated: false };
    }

    // AUFTRAG-mega52 D1: der Server-Vertrag kennt jetzt drei Sprachen — die niederlaendische
    // Oberflaeche fragt nicht mehr auf Deutsch nach (Pedis Word-Handlauf 28.07.).
    function askLocale(langCode) {
      if (langCode === "en") { return "en"; }
      return langCode === "nl" ? "nl" : "de";
    }

    // WP-UX-WOW-1 U1 (Word): Klartext statt Markdown — dieselbe Subset-Logik wie die Konsole,
    // aber als STRIP (Ueberschriften-/Fett-/Kursiv-Marker raus, Listenpunkte als "- "-Zeilen).
    function stripAskAnswerMarkdown(answer) {
      var lines = answer.replace(/\r\n?/g, "\n").split("\n");
      var out = [];
      for (var i = 0; i < lines.length; i += 1) {
        var line = lines[i].trim();
        var heading = /^#{1,6}\s+(.*)$/.exec(line);
        if (heading && heading[1] !== undefined) { line = heading[1].trim(); }
        var bullet = /^[-*]\s+(.*)$/.exec(line);
        if (bullet && bullet[1] !== undefined) { line = "- " + bullet[1]; }
        out.push(line.replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\*([^*\n]+)\*/g, "$1"));
      }

    // AUFTRAG-mega79 BLOCK B — Schnittmarken um den Frage-Abruf, damit ein Test ihn AUSFUEHREN
    // kann statt seinen Quelltext zu lesen. Dieselbe Bauform wie KW-KLARA-AISTATE-FETCH-*: das
    // Aufgabenfenster ist buildlos, also ist ein Schnitt die einzige Moeglichkeit, das WIRKLICH
    // ausgelieferte `performAsk` (nicht seinen TypeScript-Zwilling) laufen zu lassen.
    // KW-KLARA-ASK-FETCH-START
    function performAsk(question, locale, fetchFn, timeoutMs) {
      var controller = new AbortController();
      var timedOut = false;
      var timer = setTimeout(function () {

      }, timeoutMs);

      // markierter Dokumenttext darf NIE zur Cloud; clientseitig gibt es keine andere Wahl.
      return fetchFn("/api/ask", {
        method: "POST",
        credentials: "include",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ question: question, locale: locale, mode: "retrieval-only" }),
        signal: controller.signal,

        .then(function (res) {

          if (!res.ok) { return { kind: "error", detail: "HTTP " + res.status }; }

            var result = body && body.result ? body.result : null;
            var answer = result ? result.answer : null;

            // belegte Antwort — ehrlich als Wissensluecke behandeln.
            var sources = [];
            if (result && Array.isArray(result.sources)) {

                var id = result.sources[i];

              }

              result &&
              result.answered === true &&
              typeof answer === "string" &&

              sources.length > 0

                kind: "answered",
                // WP-UX-WOW-1 U1: Klartext im Panel UND im eingefuegten Text.
                answer: stripAskAnswerMarkdown(answer),

                // AUFTRAG-mega34 B: die serverseitige Einstufung reist mit. Fehlt sie, ist der
                // Grad fail-safe "unverified" — Word behauptet nie Sicherheit ohne Beleg.
                grade: askGradeOf(result.evidence),
                evidence: result.evidence || undefined,

                // Auf dem retrieval-only-Weg dieses Fensters fehlt es immer (der Server laesst es

            return { kind: "gap" };

        .catch(function (err) {

          return { kind: "error", detail: err && err.message ? err.message : "offline" };

        });

    // KW-KLARA-ASK-FETCH-END

    // AUFTRAG-mega81 BLOCK A — die eine Entscheidung, ob die KI-Kennzeichnung sichtbar wird.
    // Schnittmarken wie bei KW-KLARA-ASK-FETCH-*: das Aufgabenfenster ist buildlos, ein Schnitt ist
    // die einzige Moeglichkeit, die WIRKLICH ausgelieferte Entscheidung auszufuehren statt ihren
    // Quelltext zu lesen. Sie haengt AUSSCHLIESSLICH am serverseitigen Signal (`result.aiGenerated`)
    // — nicht an der Flaeche, nicht an einer Einstellung, nicht an der Anwesenheit des Satzes.
    // KW-KLARA-AI-NOTICE-START
    function askAiNoticeVisible(outcome) {
      return !!(outcome && outcome.kind === "answered" && outcome.aiGenerated === true);
    }
    // KW-KLARA-AI-NOTICE-END

    // Sie an das Element haengen — EINE Stelle, von resetAskResult und renderAskOutcome gerufen.
    function renderAiNotice(outcome) {
      var el = document.getElementById("ask-ai-notice");
      if (!el) { return; }
      el.className = askAiNoticeVisible(outcome) ? "muted" : "muted hidden";
    }

    function canInsertAnswer(outcome) {
      var hasSource = false;
      if (outcome && Array.isArray(outcome.sources)) {
        for (var i = 0; i < outcome.sources.length; i += 1) {
          var id = outcome.sources[i];
          if (typeof id === "string" && id.trim().length > 0) { hasSource = true; break; }
        }
      }
      return Boolean(
        outcome &&
          outcome.kind === "answered" &&
          typeof outcome.answer === "string" &&
          outcome.answer.trim().length > 0 &&
          hasSource
      );
    }

    function buildAskSourceLine(titles, dateLabel, template) {
      var names = [];
      for (var i = 0; i < titles.length; i += 1) {
        var name = (titles[i] || "").trim();
        if (name.length > 0) { names.push(name); }
      }
      var joined = names.length > 0 ? names.join(", ") : "KLARWERK";
      return template.replace("{titles}", joined).replace("{date}", dateLabel);
    }

    // AUFTRAG-mega34 B: der Grad aus dem Server-Feld — FAIL-SAFE. Fehlt das Feld (alter Server,
    // abgeschnittener Body), gilt die Antwort als NICHT belegt.
    function askGradeOf(evidence) {
      return evidence && evidence.grade === "verified" ? "verified" : "unverified";
    }

    // AUFTRAG-mega34 B2: DERSELBE Hinweis fuer Anzeige, Kopieren und Einfuegen — eine Auswahl,
    // drei Wege, keine Abweichung.
    function answerInsertEvidenceNote(grade, texts) {
      return grade === "verified" ? texts.verified : texts.unverified;
    }

    // AUFTRAG-mega34 B2: der EINGEFUEGTE Text traegt die Einstufung mit. Das ist der Punkt, an dem
    // das Ergebnis das Haus verlaesst — ein Hinweis nur im Panel reist nicht mit ins Dokument.
    // AUFTRAG-mega36 D: ohne Koerper (nach Abzug eines bereits vorhandenen Metablocks) beginnt der
    // Text NICHT mit zwei Leerzeilen — die Quellen-Zeile steht dann allein.
    function buildAnswerInsertText(answer, sourceLine, truncatedNote, evidenceNote) {
      var head = answer.replace(/\s+$/g, "");
      var base = head.length > 0 ? head + "\n\n" + sourceLine : sourceLine;
      var withEvidence = evidenceNote && evidenceNote.trim().length > 0 ? base + "\n" + evidenceNote : base;
      return truncatedNote && truncatedNote.trim().length > 0 ? withEvidence + "\n" + truncatedNote : withEvidence;
    }

    function newestSourceDateLabel(dates) {
      var best = null;
      for (var i = 0; i < dates.length; i += 1) {
        var parsed = dates[i] ? Date.parse(dates[i]) : NaN;
        if (isFinite(parsed) && (best === null || parsed > best)) { best = parsed; }
      }
      return best === null ? null : formatAskDateLabel(new Date(best));
    }

    function formatAskDateLabel(date) {
      function pad(n) { return n < 10 ? "0" + n : String(n); }
      return pad(date.getDate()) + "." + pad(date.getMonth() + 1) + "." + date.getFullYear();
    }

    // AUFTRAG-mega35 A1 — DIE EINE STELLE, AN DER DER AUSZUGEBENDE TEXT ENTSTEHT (Spiegel von
    // composeAnswerOutput in wordAddin.ts). Der Nutzerin gehoert NUR der Antwortkoerper; Einstufung
    // und Quellen-Zeile setzt diese Funktion im AUGENBLICK des Kopierens/Einfuegens an — sie koennen
    // deshalb nicht fehlen, egal wann und wie lange bearbeitet wurde.
    // AUFTRAG-mega36 D (bens GELB-2): die Zusammensetzung ist IDEMPOTENT. Erkannt wird der am ENDE
    // angehaengte Metablock — Zeilen in genau den Formen, die diese Funktion selbst erzeugt (beide
    // Quellen-Zeilen-Vorlagen mit {titles}/{date} als Platzhalter, die beiden Einstufungstexte, der
    // Kappungshinweis). GRENZE: nur der Trailing-Block; eine Metazeile MITTEN im Koerper und eine
    // Metazeile in einer ANDEREN Sprache bleiben stehen.
    function composedMetaLinePattern(template) {
      var escaped = template.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return new RegExp("^" + escaped.replace(/\\\{titles\\\}/g, ".*").replace(/\\\{date\\\}/g, ".*") + "$");
    }

    function stripComposedMetaLines(body, texts) {
      var patterns = [
        composedMetaLinePattern(texts.sourceLine),
        composedMetaLinePattern(texts.sourceLineRetrieved),
      ];
      var exact = [texts.verified, texts.unverified, texts.truncatedNote]
        .map(function (value) { return (value || "").replace(/^\s+|\s+$/g, ""); })
        .filter(function (value) { return value.length > 0; });
      var lines = body.replace(/\r\n?/g, "\n").split("\n");
      while (lines.length > 0) {
        var last = (lines[lines.length - 1] || "").replace(/^\s+|\s+$/g, "");
        if (last.length === 0) { lines.pop(); continue; }
        var istMeta = exact.indexOf(last) !== -1 || patterns.some(function (p) { return p.test(last); });
        if (istMeta) { lines.pop(); continue; }
        break;
      }
      return lines.join("\n").replace(/\s+$/g, "");
    }

    function composeAnswerOutput(input) {
      var standLabel = newestSourceDateLabel(input.sourceDates);
      var sourceLine = standLabel
        ? buildAskSourceLine(input.sourceTitles, standLabel, input.texts.sourceLine)
        : buildAskSourceLine(input.sourceTitles, formatAskDateLabel(input.now), input.texts.sourceLineRetrieved);
      var evidenceNote = answerInsertEvidenceNote(input.grade, {
        verified: input.texts.verified,
        unverified: input.texts.unverified,
      });
      var truncatedNote = input.truncated ? input.texts.truncatedNote : "";
      return buildAnswerInsertText(
        stripComposedMetaLines(input.body, input.texts),
        sourceLine,
        truncatedNote,
        evidenceNote
      );
    }

    // AUFTRAG-mega36 B2: GANZE Auswahl oder Bruchstueck. Der abgefangene native Kopiervorgang gibt
    // den abgeleiteten Text NUR bei ganzem Antwortkoerper aus; eine Teilauswahl bleibt roh (ein
    // Bruchstueck ist keine Antwort und traegt deshalb auch keine Einstufung). Umgebender Leerraum
    // darf ausgelassen werden — mehr nicht.
    function answerSelectionIsWhole(value, start, end) {
      var body = (value || "").replace(/^\s+|\s+$/g, "");
      if (body.length === 0) { return false; }
      var from = Math.max(0, Math.min(start, end));
      var to = Math.min((value || "").length, Math.max(start, end));
      return (value || "").slice(from, to).replace(/^\s+|\s+$/g, "") === body;
    }

    // WP-KLARA-ASK-FIX (bens Fix 4): Praefix/Fallback kommen LOKALISIERT vom Aufrufer.
    function openQuestionDraftTitle(question, prefix, fallbackTitle) {
      var trimmed = question.trim();
      if (trimmed.length === 0) { return fallbackTitle; }

    function classifyInsertError(detail) {

    // DOM-/Office-frei: die konkreten Aufrufe reicht der Aufrufer als injizierte Versuche (Spiegel des
    // Moduls performInsert — sequenziell, erster Erfolg gewinnt).
    function performInsert(text, attempts) {
      var index = 0;
      var lastDetail = "";
      var sawPermission = false;
      function tryNext() {
        if (index >= attempts.length) {
          return Promise.resolve({ ok: false, failure: sawPermission ? "permission" : "other", detail: lastDetail });
        }
        var attempt = attempts[index];
        index += 1;
        return Promise.resolve()
          .then(function () { return attempt.run(text); })
          .then(function () { return { ok: true, method: attempt.method }; })
          .catch(function (err) {
            var detail = err && err.message ? err.message : String(err == null ? "" : err);
            lastDetail = detail || lastDetail;

    function performCopy(text, clipboard) {

        .then(function () { return clipboard.writeText(text); })

    var KLARA_AI_TASK = "answer";

    function deriveAiAvailable(status, task) {
      if (!status) { return false; }
      if (status.reachable === "unreachable") { return false; }
      var taskUsable = status.tasks ? status.tasks[task] : undefined;
      if (taskUsable === false) { return false; }

    function klaraAiLage(phase, status) {

      if (!deriveAiAvailable(status, KLARA_AI_TASK)) { return "keine"; }
      if (status.mode === "cloud") { return "extern"; }
