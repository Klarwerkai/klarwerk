<!doctype html>
<!-- WP-KLARA-1: Klara in Word — selbstenthaltendes Taskpane (kein React, kein Build). Läuft auf der
     App-Domain (public/ wird statisch mitgeliefert) → API-Aufrufe sind same-origin (Session-Cookie).
     WP-KLARA-ASK (Pedis Entscheid 22.07., bens Option B): zwei ehrliche Faehigkeiten — (1) Klara
     FRAGEN: markierte Aussage (oder freie Frage) gegen den BESTEHENDEN Konsolen-Vertrag
     POST /api/ask — Antworten kommen AUSSCHLIESSLICH aus validiertem Werkswissen mit Quellen;
     ohne Grundlage bleibt die Frage ehrlich offen (Wissensluecke, kein Chatbot, nichts erfunden).
     (2) Wissen ERFASSEN: Auswahl/Dokument als KLARWERK-ENTWURF senden (kein Auto-Speichern als
     fertiges Wissensobjekt). Kein Add-in-eigener Modellaufruf — die Frage reist wie jede
     Konsolen-Frage zum Server, dessen Routing unveraendert gilt. -->
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <!-- JOB 1077: die GELADENE Fassung. Sie steht hier NICHT als Zahl, sondern als Platzhalter;
       gestempelt wird sie beim Ausliefern (services/app/src/web-static.ts, stempleFassung).
       Damit kann diese Seite niemals eine andere Fassung behaupten als der Server, der sie
       geschickt hat — und ein Neuladen aendert sie WIRKLICH. Unersetzt (Quelle/Dev): "dev". -->
  <meta name="kw-loaded-version" content="__KW_FASSUNG__" />
  <title>Klara — KLARWERK</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script src="begriffe.js?v=__KW_FASSUNG__"></script><script src="anleitung.js?v=__KW_FASSUNG__"></script>
  <link rel="stylesheet" href="taskpane.css?v=__KW_FASSUNG__" />
</head>
<body>
  <!-- ============================================================================================
       JOB 3056 K1 — DER KOPF (Ruhe.dc.html Z.17-26 / Main.dc.html Z.17-23 / Einstellungen Z.17-20).
       ============================================================================================
       Links der Zurueck-Chevron (nur im Antwortzustand, in den Einstellungen und in der Hilfe) und
       der Titel; rechts der Umschalter Fragen | Erfassen (nur auf den beiden Flaechen) und das
       Zahnrad. Sonst NICHTS: die Sprachwahl lebt in den Einstellungen weiter (#lang-*), der Stand
       im Fuss der Einstellungen (#kw-stand), Sitzung und Zustimmung in der Gruppe „Konto" bzw. als
       Schalterzeile, der KI-Stand von KLARWERK (W1-Vertrauenskopf) unter „Wie Klara antwortet". -->
  <header id="kw-kopf">
    <div id="kw-kopf-links">
      <button type="button" id="kw-zurueck" class="kw-icon hidden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </button>
      <div class="brand" id="kw-titel">Klara</div>
      <!-- JOB 3512 · KW-MARKE: das Firmenlogo der Demo-CI. Es startet VERBORGEN und ohne `src` —
           ein leeres `src` wäre ein Abruf auf die eigene Seite. Beides setzt `kwMarkeAnwenden`
           am Skriptende, und nur dann, wenn der Server eine aktive Marke meldet. -->
      <img id="kw-marke-logo" class="hidden" alt="" />
    </div>
    <div id="kw-kopf-rechts">
      <!-- WP-KLARA-ASK (Teil 3): zwei Bereiche — Fragen (das Funktionsversprechen) und Erfassen
           (der bestehende Entwurf-Sender). Segment-Knoepfe, kein Framework, buildlos. -->
      <div class="tabs" id="kw-segment" role="tablist" aria-label="Bereiche">
        <button type="button" id="tab-ask" class="active" data-t="tabAsk"></button>
        <button type="button" id="tab-capture" data-t="tabCapture"></button>
      </div>
      <button type="button" id="kw-zahnrad" class="kw-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      </button>
    </div>
  </header>

  <!-- WP-KLARA-ASK (Teil 1): Klara fragen — Auswahl als Frage, quellengebundene Antwort aus dem
       VALIDIERTEN Werkswissen ueber den BESTEHENDEN Konsolen-Vertrag POST /api/ask (Same-Origin-
       Session; serverseitige Permission ko.read wie in der Fragen-Konsole — kein neuer Guard). -->
  <div id="section-ask">
    <!-- RUHE (Ruhe.dc.html Z.28-31): die Lupe und der EINE Satz — oder, wenn die Sitzung fehlt
         bzw. der Server nicht erreichbar ist, EIN Satz und EIN Knopf (checkSession). Das
         Begriffsbild (KA1) erscheint darunter nur mit Begriffen aus einem offenen Word-Dokument. -->
    <div id="ask-ruhe">
      <svg id="ask-ruhe-lupe" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.3-4.3"></path></svg>
      <div id="ask-ruhe-satz" data-t="askRuheSatz"></div>
      <div id="session-block" class="hidden">
        <div id="session-status" class="status warn" data-t="sessionChecking"></div>
        <div id="login-block" class="hidden">
          <button type="button" class="primary" id="login-btn" data-t="loginCta"></button>
          <!-- WP-KLARA-1c: sichtbar nur waehrend des Anmelde-Wartens (Session-Polling laeuft). -->
          <button type="button" class="ghost hidden" id="login-cancel-btn" data-t="loginCancel"></button>
          <!-- WP-IC-PAKET-1c (g): ehrlicher Hinweis NUR im Fallback-Fall (window.open statt Office-Dialog). -->
          <p class="muted hidden" id="login-context-hint" data-t="loginOtherContext"></p>
        </div>
        <button type="button" class="ghost hidden" id="session-retry-btn" data-t="retryCta"></button>
      </div>
      <!-- KW-KA1-TERMS-START — DAS DOKUMENT-BEGRIFFSBILD (JOB 1149, OFFEN.md KA1). Worum es im
           offenen Dokument gerade geht — hausintern gewonnen, ohne KI, ohne Egress. JOB 3056: ohne
           Titel und ohne Hinweissatz, sichtbar nur mit Begriffen (ka1Anzeigen). Bewusst KEINE
           Beispielbegriffe im Markup: leer ist die Wahrheit. -->
      <div id="ka1-block" class="hidden">
        <ul id="ka1-terms"></ul>
        <p id="ka1-empty"></p>
      </div>
      <!-- KW-KA1-TERMS-END (Markup) -->
    </div>
    <!-- JOB 3093 · N1-BESTAND (Markup) — „Haben wir das schon?" (PRIORITAETEN N1 b). Die Logik
         steht im Skriptblock KW-N1-BESTAND-START/END; das Markup traegt BEWUSST keine eigene
         KW-Marke, damit die Marke nicht an zwei Orten je ein Paar aufmacht (tests/klara-zerlegung/
         marken-skelett.test.ts misst genau solche Bruchstuecke). Der Block steht NEBEN der Ruhe-Mitte,
         nicht in ihr: die Mitte traegt nur Lupe und den EINEN Satz, kein Knopf (JOB 3056 R4,
         tests/app/k1-sitzungslagen.test.tsx) — wie die KA3-Karte, die ebenfalls unter #ask-ruhe
         eingehaengt wird. Sichtbar nur angemeldet, mit offenem Word-Dokument und in der Ruhe
         (bestandZeichnen); Standzeile und Liste erst nach einer Frage. Kein Erklaertext: ein Knopf,
         eine datierte Zeile, die Treffer. -->
    <div id="bestand-block" class="hidden">
      <button type="button" class="ghost" id="bestand-btn" data-t="bestandCta"></button>
      <div id="bestand-ergebnis" class="hidden" aria-live="polite">
        <p id="bestand-stand" class="muted"></p>
        <ul id="bestand-liste"></ul>
      </div>
      <!-- JOB 3243 · M3c-UI (Markup) — DER QUELLENFUND, GETRENNT VON DUBLETTE UND KONFLIKT.
           Die Route liefert seit JOB 3216 `sourceHits` (Passage steht im VOLLTEXT eines Objekts) —
           eine ANDERE Aussage als `duplicates` (dieselbe Wissensaussage liegt vor). Deshalb ein
           EIGENER Behaelter unter der Standzeile und nicht eine weitere Zeile in #bestand-liste:
           eine gemeinsame Liste waere die Vermischung, die check-text-routes.ts:352-359 ausdruecklich
           ausschliesst. Die Logik steht im Skriptblock KW-N1-BESTAND-START/END (wie das Markup von
           JOB 3093 traegt dieser Kasten BEWUSST keine eigene KW-Marke — sonst machte dieselbe Marke
           an zwei Orten je ein Paar auf, was tests/klara-zerlegung/marken-skelett.test.ts misst).
           Verborgen, solange nichts zu sagen ist: in der Ruhe steht hier kein Zeichen. -->
      <details id="quellenfund-block" class="hidden" open aria-live="polite">
        <summary id="quellenfund-stand" class="muted"></summary>
        <ul id="quellenfund-liste"></ul>
      </details>
    </div><div id="begriffe-block" class="hidden"><div id="begriffe-kopf" style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;"><button type="button" class="ghost" id="begriffe-btn"></button><select id="begriffe-bereich"></select></div><p id="begriffe-grenze" class="muted"></p><p id="begriffe-stand" class="muted" aria-live="polite"></p><ul id="begriffe-liste"></ul></div>
    <!-- ========================================================================================
         KW-D2-LUECKE-START — DIE EHRLICHE LUECKE NACH ZIELBILD KeinWissen.dc.html (JOB 3046).
         ========================================================================================
         Die ruhige, mittige Flaeche #ask-luecke (kein Kasten), die Lupe, der EINE Satz
         (askGapTitle), die Hauptaktion „Frage aendern" (askFrageAendern: resetAskResult, Cursor
         ans Ende von #ask-input) und die Nebenaktion „offene Frage" (sendOpenQuestion, mit
         Generation askErgebnisGeneration gegen verspaetete Ruecklaeufe). JOB 3056: die Fusszeile
         der Luecke (askGapFuss) steht unter „Wie Klara antwortet" — im Sichtfeld kein Hinweistext. -->
    <div id="ask-gap-block" class="hidden">
      <div id="ask-luecke">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4.35-4.35"></path></svg>
        <div id="ask-luecke-satz" data-t="askGapTitle"></div>
        <button type="button" id="ask-luecke-frage-aendern" data-t="askGapFrageAendern"></button>
        <a href="#" id="ask-gap-send-btn" data-t="askGapSendCta"></a>
      </div>
      <!-- JOB 3092 S6 (W5): Pedis Fall vom 21:28 (OFFEN.md W5) — die Luecke schweigt nicht mehr ueber
           Wissen, das es gibt, aber noch niemand geprueft hat. EIN Satz mit Titel(n), nur wenn der
           Server `ungeprueft` nicht leer liefert (renderAskUngeprueft). Als Geschwister von
           #ask-luecke, nicht darin: dessen Kinder sind in Chromium exakt gepinnt (zielbild-keinwissen). -->
      <p id="ask-gap-ungeprueft" class="hidden"></p><p id="ask-gap-zuordnung" class="hidden" data-t="askCaveatUnattributed"></p>
      <p id="ask-gap-open-block" class="hidden">
        <a id="ask-gap-open-link" href="https://app.klarwerk.ai/erfassen" target="_blank" rel="noopener" data-t="askGapOpenLink"></a>
      </p>
    </div>
    <!-- KW-D2-LUECKE-END -->
    <!-- ==========================================================================================
         JOB 3056 K1 — DIE ANTWORTFLAECHE NACH Main.dc.html (Pedi, 04.09.).
         ==========================================================================================
         Die gestellte Frage als gedaempfte Zeile (ein Klick holt sie zum Bearbeiten ins Feld), die
         Antwortkarte, die zwei Knoepfe. Das Frage-Feld unten (#ask-feld) bleibt sichtbar — es IST
         die neue Frage; der Zurueck-Chevron im Kopf fuehrt in die Ruhe (askNeueFrage). Jede Kennung
         des frueheren Antwortblocks lebt weiter, mit denselben Rueckrufen:
           #ask-answer-edit IST der Antworttext (bearbeitbar; Hinweis beim Fokus, aria-describedby),
           #ask-ai-notice die KI-Kennzeichnung (am serverseitigen aiGenerated-Signal, mega81),
           #ask-sources / .quelle-chip die Quellen als Chips „n · Titel" (Deep-Link auf das Objekt),
           #ask-mehr-block („Mehr", Funktionsinventar §5a): Einstufung #ask-evidence-note,
           Vorbehalt/Konflikt #ask-evidence-detail, Ausschnitt #ask-snippet-block, Herkunft und die
           Quellen mit Status, Rolle, Vertrauen, Stand (#ask-quellen-detail),
           #ask-insert-btn / #ask-copy-btn die Aktionen, #ask-copy-fallback der Rueckfall (mega36),
           #ask-vorbehalt der EINE lagebezogene Satz unter der Karte (Lieferung 5).
         Werte gemessen in tests/design/zielbild-k1-antwort.test.ts (Chromium, dist-Fassung). -->
    <div id="ask-answer-block" class="hidden">
      <button type="button" id="ask-frage-zeile-btn">
        <span id="ask-frage-zeile"></span>
      </button>
      <div id="antwortkarte">
        <h2 data-t="askAnswerTitle" class="nur-vorlesen"></h2>
        <!-- JOB 3056 Runde 4: das Feld, sein unsichtbarer Spiegel (Messung des Textendes) und die
             Fussnotenziffern <sup class="fussnote"> (renderAskFussnoten) in EINEM Rahmen. -->
        <div id="ask-answer-text">
          <textarea id="ask-answer-edit" class="answer-text" rows="4" aria-describedby="ask-answer-edit-hint"></textarea>
          <div id="ask-answer-spiegel" aria-hidden="true"></div>
          <span id="ask-fussnoten" class="hidden"></span>
        </div>
        <button type="button" class="ghost hidden" id="ask-answer-toggle"></button>
        <!-- JOB 3092 S6 (W5): DIE HERKUNFT AN DER ANTWORT — unmittelbar unter dem Antworttext, nicht
             erst unter „Mehr". Je TRAGENDER Quelle (citedSources) eine Zeile „Quelle: Titel · Pruefstand
             · Version" (renderAskHerkunft), der Titel ein Link auf den Volltext (koDetailUrl, derselbe
             Weg wie die Chips). Ohne citedSources steht „Dafuer habe ich keinen Beleg." — nie eine
             Antwort ohne diese Zeile. Darunter, NUR im Fall, der Ungeprueft-Satz (renderAskUngeprueft):
             was der Server als vorhanden, aber ungeprueft meldet (Feld `ungeprueft`, JOB 1591). -->
        <div id="ask-herkunft" class="hidden"></div>
        <p id="ask-ungeprueft" class="hidden"></p>
        <!-- JOB 3366 (KI-FRAGMENT-SICHTBAR): der Satz an einer am Token-Limit ABGESCHNITTENEN
             Antwort. Er steht NUR, wenn der Server den Abbruch gemeldet hat (`result.abgeschnitten`,
             gelesen in performAsk, gesetzt in renderAskFragment) — nie aus dem Text geraten und nie
             als Gegenaussage „vollstaendig". Das Antwortfeld darueber bleibt unangetastet. -->
        <p id="ask-fragment" class="hidden"></p>
        <p class="muted" id="ask-answer-edit-hint" data-t="askAnswerEditHint"></p>
        <!-- mega81 BLOCK A: die KI-Kennzeichnung ist an das serverseitige `aiGenerated`-Signal
             GEBUNDEN — auf dem retrieval-only-Weg nie sichtbar, auf einem Modellweg von selbst. -->
        <p class="muted hidden" id="ask-ai-notice" data-t="aiGeneratedNotice"></p>
        <div id="ask-sources-block" class="hidden">
          <ul id="ask-sources"></ul>
        </div>
        <div id="ask-mehr-block">
          <p id="antwortkarte-herkunft-zeile" data-t="askHerkunft"></p>
          <!-- mega34 B2: die Einstufung — derselbe Text wie im eingefuegten Absatz. W1-VERTRAUENSKOPF-08 B:
               Vorbehalt und Konfliktlage GETRENNT, eigene Zeilen. -->
          <p id="ask-evidence-note" class="status hidden"></p>
          <div id="ask-evidence-detail">
            <p id="ask-caveat-line" class="status warn hidden"></p>
            <p id="ask-conflict-line" class="status warn hidden"></p><p id="ask-lage-line" class="status warn hidden"></p><ul id="ask-konflikt-seiten" class="hidden"></ul>
          </div>
          <!-- W1-VERTRAUENSKOPF-08 B: hoechstens der erste real gelieferte Ausschnitt — ein Zitat. -->
          <div id="ask-snippet-block" class="hidden">
            <span class="snippet-label" id="ask-snippet-label"></span>
            <span class="snippet-text" id="ask-snippet-text"></span>
          </div>
          <ul id="ask-quellen-detail"></ul>
        </div>
      </div>
      <div id="antwortkarte-aktionen">
        <!-- Teil 2 (Gating): NUR bei echter quellengebundener Antwort UND bereitem Office aktiv. -->
        <button type="button" class="primary" id="ask-insert-btn" data-t="askInsertCta"></button>
        <!-- klara1b Teil B: Ausweg „Kopieren" — braucht kein Office, greift auch bei Rechte-Fehler. -->
        <button type="button" class="ghost" id="ask-copy-btn" data-t="askCopyCta"></button>
      </div>
      <!-- mega36 B3: der Fehler-Rueckfall der Zwischenablage — der VOLLSTAENDIGE abgeleitete Text
           als nur lesbares, vorausgewaehltes Feld. -->
      <div id="ask-copy-fallback" class="hidden" style="margin: 8px 16px 0;">
        <p class="muted" id="ask-copy-fallback-hint" data-t="askCopyFallbackHint" style="margin-bottom: 4px;"></p>
        <textarea id="ask-copy-fallback-text" class="answer-text" rows="8" readonly></textarea>
      </div>
      <p id="ask-vorbehalt" class="hidden"></p>
    </div>
    <!-- Die Statuszeile steht AUSSERHALB von Frage-Feld und Antwortflaeche: sie muss in beiden
         Zustaenden sichtbar sein (Antwort eingefuegt, Zwischenablage kopiert, echte Warnungen).
         Dazu EIN Knopf „Erneut versuchen" fuer Frist und Verbindungsfehler (§9). -->
    <div id="ask-status" class="status hidden"></div>
    <button type="button" class="ghost hidden" id="ask-retry-btn" data-t="retryCta"></button>
    <!-- DAS FRAGE-FELD (Ruhe.dc.html Z.33-39): Karte, Feld mit Platzhalter „Frage", runder
         Sendeknopf. Grau, solange nichts da ist; Funke dunkel mit Text; drehender Kreis waehrend
         der Suche (askWartezustand). Der Wortlaut askCta ist das aria-label (renderStatics). -->
    <div id="ask-feld">
      <div class="card" id="ask-karte">
        <p id="ask-source-note" class="muted hidden"></p>
        <textarea id="ask-input" rows="1"></textarea>
        <button type="button" class="primary" id="ask-btn" disabled>
          <svg class="pfeil" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"></path><path d="M5 12l7-7 7 7"></path></svg>
          <svg class="kreisel" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 1-6.36 2.64"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <div id="section-capture" class="hidden">
  <!-- JOB 3057 K2 — „Erfassen" nach Zielbild Erfassen.dc.html (Z.28-52): die Markierungskarte
       (Kicker + Absaetze; ohne Markierung EIN Satz; nach dem Senden EINE Zeile mit Link und nur
       im Fall EIN Bilder-Satz mit Link), die Zeile „Titel" (vorbelegt aus der ersten Zeile,
       editierbar; reist als Titel des Entwurfs), EIN Knopf, darunter der Textlink „Ganzes
       Dokument uebernehmen" (loest den Dokument-Weg direkt aus — .docx zuerst, Rueckfall
       Word.run). Fehler- und Officefall: EIN Satz, EIN Knopf. Die Bereich-Zeile der Vorlage
       (Z.39-45) IST seit JOB 3555 gebaut — der Grund ihres Fehlens ist entfallen: seit JOB 3507
       liefert `GET /api/categories` (services/app/src/routes/category-routes.ts) die Bereiche, die
       im SICHTBAREN Bestand des Fragenden wirklich vorkommen. Nur daher kommen die Namen; es gibt
       keine hartkodierte Liste und keinen Platzhaltertext. Radiogruppe, Bilder-Hinweisband, Pruef- und
       Seitenhinweis sind aus dem Sichtfeld ERSETZT; ihre Funktionen wohnen seit JOB 3506 K2b
       hinter dem Zahnrad (#einst-erfassen) — kein Verlust, benannter Ort, gemessen in
       tests/design/k2-funktionsinventar.test.ts und tests/k2b-erfassen-reste. -->
  <div class="card" id="capture-karte">
    <h2 class="nur-vorlesen" data-t="captureCardTitle"></h2>
    <div id="capture-kicker" class="hidden"></div>
    <div id="capture-absaetze"></div>
    <p id="capture-leer" data-t="captureEmpty"></p>
    <p id="capture-ergebnis" class="hidden"><span data-t="sendOk"></span><a id="open-link" href="https://app.klarwerk.ai/erfassen" target="_blank" rel="noopener" data-t="openLink"></a></p>
    <p id="capture-bilder-ergebnis" class="hidden"><span id="capture-bilder-satz"></span><a id="capture-bilder-link" href="https://app.klarwerk.ai/erfassen" target="_blank" rel="noopener" data-t="captureBilderLink"></a></p>
    <!-- JOB 3092 S6 (W6): DIE DUBLETTENPRUEFUNG VOR DEM EINREICHEN. Sobald eine Markierung steht,
         geht sie an POST /api/check-text (w6DublettenAusCheckText, derselbe Weg, den W6 gebaut hat)
         und die Karte sagt, was der Bestand dazu hat: Treffer mit Titel, Beziehung und Fundort,
         „Nichts Vergleichbares gefunden (geprueft <Zeit>)" NUR nach erfolgreichem Lauf, sonst
         „Pruefung nicht moeglich". Sie blockiert nichts: der Knopf bleibt frei (renderCaptureDubletten). -->
    <div id="capture-dubletten" class="hidden">
      <p id="capture-dubletten-satz"></p>
      <ul id="capture-dubletten-liste"></ul>
    </div>
  </div>
  <!-- JOB 3667 (WORD-RUECKWEG): Rueckweg auf ein BESTEHENDES Wissensobjekt (PUT /api/kos/:id) — alles
       darunter legt NEUES an. Nur im Bild bei Kandidaten DERSELBEN Markierung; vorgewaehlt ist nie

       Zeilen wie bisher (#klara-s4-provider/-session/-deviation), lagebezogen.

      <!-- AUFTRAG-W1-KLARA-KOPF-CONSENT-06 (BASIC-1) — DIE EINMALIGE SITZUNGSZUSTIMMUNG. Sichtbar
